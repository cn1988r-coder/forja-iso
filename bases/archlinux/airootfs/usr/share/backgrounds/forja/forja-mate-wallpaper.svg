<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <title>Forja OS MATE wallpaper</title>
  <desc>Fundo cinza uniforme com a chama original da Forja OS em preto sólido, em relevo discreto.</desc>
  <defs>
    <filter id="plaque-shadow" x="-35%" y="-25%" width="170%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13" result="blur"/>
      <feOffset in="blur" dx="15" dy="19" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="3840" height="2160" fill="#858585"/>
  <path
    d="M67 7c3 17 17 27 27 42 9 13 14 25 10 40-5 21-22 34-42 34S25 110 20 89C14 64 32 47 44 32c7-9 12-17 14-27 4 7 6 13 9 22 2-7 2-13 0-20Z"
    transform="translate(1408 588) scale(8)"
    fill="#050505"
    filter="url(#plaque-shadow)"/>
</svg>
