---
modules-search: [ local ]
instances:
  - id: install-base-system
    module: shellprocess
    config: shellprocess-pacstrap.conf
  - id: copy-forja-desktop
    module: shellprocess
    config: shellprocess-copy-forja.conf
  - id: apply-forja-desktop
    module: shellprocess
    config: shellprocess-apply-forja.conf
  - id: record-forja-install-time
    module: shellprocess
    config: shellprocess-record-install-time.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@install-base-system
      - shellprocess@copy-forja-desktop
      - shellprocess@apply-forja-desktop
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - displaymanager
      - hwclock
      - bootloader
      - shellprocess@record-forja-install-time
      - services-systemd
      - umount
  - show:
      - finished

branding: forja
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
