---
modules-search: [ local ]
instances:
  - id: cleanup-live-user
    module: shellprocess
    config: shellprocess-cleanup-live-user.conf
  - id: cleanup-installer
    module: shellprocess
    config: shellprocess-cleanup-installer.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@cleanup-live-user
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - displaymanager
      - hwclock
      - bootloader
      - services-systemd
      - shellprocess@cleanup-installer
      - umount
  - show:
      - finished
branding: forja
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
