---
defaultGroups: [wheel, audio, video, storage, network, lp, optical]
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8
user:
  shell: /bin/bash
  forbidden_names: [root, nobody]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: forja
  forbidden_names: [localhost]
presets:
  fullName:
    editable: true
  loginName:
    editable: true
