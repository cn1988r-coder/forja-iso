---
dontChroot: true
timeout: 180
verbose: true
script:
  - "/usr/bin/install -d ${ROOT}/usr/bin ${ROOT}/usr/lib ${ROOT}/usr/share/applications ${ROOT}/usr/share/icons/hicolor/scalable/apps ${ROOT}/usr/share/polkit-1/actions ${ROOT}/usr/share/forja-monitor ${ROOT}/usr/share/backgrounds ${ROOT}/usr/local/bin ${ROOT}/usr/local/lib/forja ${ROOT}/etc/xdg/autostart ${ROOT}/etc/skel ${ROOT}/etc/dconf/profile ${ROOT}/etc/dconf/db/local.d ${ROOT}/etc/lightdm/lightdm.conf.d"
  - "/usr/bin/cp -a /usr/bin/forja-store /usr/bin/forja-pacman-transaction /usr/bin/forja-aur-build /usr/bin/forja-monitor /usr/bin/forja-record-install-time /usr/bin/forja-update-indicator /usr/bin/forja-luz-noturna ${ROOT}/usr/bin/"
  - "/usr/bin/cp -a /usr/lib/forja ${ROOT}/usr/lib/"
  - "/usr/bin/cp -a /usr/share/applications/forja-store.desktop /usr/share/applications/forja-monitor.desktop ${ROOT}/usr/share/applications/"
  - "/usr/bin/cp -a /usr/share/icons/hicolor/scalable/apps/forja-store.svg /usr/share/icons/hicolor/scalable/apps/forja-update-current.svg /usr/share/icons/hicolor/scalable/apps/forja-update-available.svg ${ROOT}/usr/share/icons/hicolor/scalable/apps/"
  - "/usr/bin/cp -a /usr/share/polkit-1/actions/br.forja.store.policy ${ROOT}/usr/share/polkit-1/actions/"
  - "/usr/bin/cp -a /usr/share/forja-monitor/forja-flame.svg ${ROOT}/usr/share/forja-monitor/"
  - "/usr/bin/cp -a /usr/share/backgrounds/forja ${ROOT}/usr/share/backgrounds/"
  - "/usr/bin/cp -a /etc/xdg/autostart/forja-update-indicator.desktop /etc/xdg/autostart/forja-luz-noturna.desktop ${ROOT}/etc/xdg/autostart/"
  - "/usr/bin/cp -a /etc/skel/.config ${ROOT}/etc/skel/"
  - "/usr/bin/cp -a /etc/lightdm/lightdm.conf.d/60-forja-session.conf ${ROOT}/etc/lightdm/lightdm.conf.d/"
  - "/usr/bin/cp -a /etc/dconf/profile/user ${ROOT}/etc/dconf/profile/"
  - "/usr/bin/cp -a /etc/dconf/db/local.d/00-forja-mate ${ROOT}/etc/dconf/db/local.d/"
  - "/usr/bin/cp -a /usr/local/lib/forja/apply-defaults.sh ${ROOT}/usr/local/lib/forja/"
  - "/usr/bin/cp -a /usr/local/bin/forja-apply-defaults ${ROOT}/usr/local/bin/"
  - "/usr/bin/cp -a /etc/xdg/autostart/forja-apply-defaults.desktop ${ROOT}/etc/xdg/autostart/"
