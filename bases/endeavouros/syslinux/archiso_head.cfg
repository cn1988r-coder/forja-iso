# Cabecalho visual do menu BIOS da Forja OS.
UI vesamenu.c32
MENU TITLE FORJA OS
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 8
MENU VSHIFT 10
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;37;40 #ffffff #00000000 std
MENU COLOR sel          1;37;40 #ffffff #505050 all
MENU COLOR unsel        37;40   #ffffff #00000000 std
MENU COLOR help         37;40   #d0d0d0 #00000000 std
MENU COLOR timeout_msg  37;40   #d0d0d0 #00000000 std
MENU COLOR timeout      1;37;40 #ffffff #00000000 std
MENU CLEAR
