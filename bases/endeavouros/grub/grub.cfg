# Forja OS - menu de inicializacao da ISO.
# Mantem os parametros de boot do archiso; altera somente a apresentacao.
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm
insmod png
insmod font

if loadfont ${prefix}/fonts/unicode.pf2; then
    set gfxmode=auto
    set gfxpayload=keep
fi

terminal_input console
terminal_output gfxterm

set color_normal="light-gray/black"
set color_highlight="black/light-gray"
set menu_color_normal="light-gray/black"
set menu_color_highlight="black/light-gray"
set timeout=10
set default=0
set timeout_style=menu

clear
echo
echo "                         FORJA OS"
echo "             Sistema livre. Base EndeavourOS / Arch."
echo

menuentry "Iniciar Forja OS" --class gnu-linux --class os --id forja-live {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Iniciar Forja OS (acessibilidade)" --class gnu-linux --class os --id forja-accessibility {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Configuracao do firmware UEFI" --id uefi-firmware {
        fwsetup
    }
fi

menuentry "Reiniciar" --class reboot --id reboot {
    reboot
}

menuentry "Desligar" --class shutdown --id shutdown {
    halt
}
