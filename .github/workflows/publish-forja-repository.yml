name: Publish Forja application repository

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged
    timeout-minutes: 60
    steps:
      - name: Prepare Arch package builder
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git pacman-contrib gnupg gtk3 python-gobject polkit mate-terminal sudo

      - name: Checkout Forja OS sources
        uses: actions/checkout@v4

      - name: Check publishing credentials
        shell: bash
        env:
          FORJA_UPDATES_TOKEN: ${{ secrets.FORJA_UPDATES_TOKEN }}
          FORJA_GPG_PRIVATE_KEY: ${{ secrets.FORJA_GPG_PRIVATE_KEY }}
          FORJA_GPG_KEY_ID: ${{ secrets.FORJA_GPG_KEY_ID }}
        run: |
          set -Eeuo pipefail
          test -n "$FORJA_UPDATES_TOKEN" || { echo "Configure FORJA_UPDATES_TOKEN with write access to cn1988r-coder/forja-updates." >&2; exit 1; }
          test -n "$FORJA_GPG_PRIVATE_KEY" || { echo "Configure FORJA_GPG_PRIVATE_KEY." >&2; exit 1; }
          test -n "$FORJA_GPG_KEY_ID" || { echo "Configure FORJA_GPG_KEY_ID with the full signing-key fingerprint." >&2; exit 1; }

      - name: Build Forja packages
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/pkgbuild/forja-store" "$RUNNER_TEMP/pkgbuild/forja-repo-client"
          cp -a desktop/mate/forja-store/. "$RUNNER_TEMP/pkgbuild/forja-store/"
          cp -a desktop/mate/forja-repo/. "$RUNNER_TEMP/pkgbuild/forja-repo-client/"
          useradd --create-home builder
          chown -R builder:builder "$RUNNER_TEMP/pkgbuild"
          runuser -u builder -- bash -lc "cd '$RUNNER_TEMP/pkgbuild/forja-repo-client' && makepkg --cleanbuild --noconfirm"
          pacman -U --noconfirm --nodeps "$RUNNER_TEMP/pkgbuild/forja-repo-client/"*.pkg.tar.zst
          runuser -u builder -- bash -lc "cd '$RUNNER_TEMP/pkgbuild/forja-store' && makepkg --cleanbuild --noconfirm"
          mkdir -p public/x86_64
          cp "$RUNNER_TEMP/pkgbuild/forja-store/"*.pkg.tar.zst public/x86_64/
          cp "$RUNNER_TEMP/pkgbuild/forja-repo-client/"*.pkg.tar.zst public/x86_64/
          pacman -Qip public/x86_64/*.pkg.tar.zst

      - name: Sign packages and repository database
        shell: bash
        env:
          FORJA_GPG_PRIVATE_KEY: ${{ secrets.FORJA_GPG_PRIVATE_KEY }}
          FORJA_GPG_KEY_ID: ${{ secrets.FORJA_GPG_KEY_ID }}
          FORJA_GPG_PASSPHRASE: ${{ secrets.FORJA_GPG_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          export GNUPGHOME="$RUNNER_TEMP/forja-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$FORJA_GPG_PRIVATE_KEY" | gpg --batch --import
          for package in public/x86_64/*.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${FORJA_GPG_PASSPHRASE:-}" \
              --local-user "$FORJA_GPG_KEY_ID" --detach-sign --output "$package.sig" "$package"
          done
          repo-add public/x86_64/forja.db.tar.gz public/x86_64/*.pkg.tar.zst
          gpg --batch --yes --pinentry-mode loopback --passphrase "${FORJA_GPG_PASSPHRASE:-}" \
            --local-user "$FORJA_GPG_KEY_ID" --detach-sign \
            --output public/x86_64/forja.db.tar.gz.sig public/x86_64/forja.db.tar.gz
          cp -L public/x86_64/forja.db.tar.gz public/x86_64/forja.db
          cp -L public/x86_64/forja.db.tar.gz.sig public/x86_64/forja.db.sig
          gpg --armor --export "$FORJA_GPG_KEY_ID" > public/forja-repo.gpg
          sha256sum public/x86_64/*.pkg.tar.zst > public/SHA256SUMS

      - name: Publish to the separate forja-updates repository
        shell: bash
        env:
          FORJA_UPDATES_TOKEN: ${{ secrets.FORJA_UPDATES_TOKEN }}
        run: |
          set -Eeuo pipefail
          git config --global user.name "Forja OS Build"
          git config --global user.email "forja-build@users.noreply.github.com"
          git init "$RUNNER_TEMP/deploy"
          git -C "$RUNNER_TEMP/deploy" checkout --orphan gh-pages
          git -C "$RUNNER_TEMP/deploy" remote add origin \
            "https://x-access-token:${FORJA_UPDATES_TOKEN}@github.com/cn1988r-coder/forja-updates.git"
          cp -a public/. "$RUNNER_TEMP/deploy/"
          cat > "$RUNNER_TEMP/deploy/README.txt" <<'EOF'
Forja OS binary application repository.
Packages are signed. Use the dedicated Forja repository client.
This repository contains Forja applications only, not Arch Linux system packages.
EOF
          git -C "$RUNNER_TEMP/deploy" add -A
          git -C "$RUNNER_TEMP/deploy" commit -m "Publish signed Forja application packages"
          git -C "$RUNNER_TEMP/deploy" push --force origin gh-pages

      - name: Report repository URL
        run: echo "Published repository: https://cn1988r-coder.github.io/forja-updates/x86_64/"
