name: Compilar ISO VENOM OS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venom-os-archiso-build
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Construir ambiente Arch Linux
        run: |
          docker build --pull \
            --build-arg BUILD_UID="$(id -u)" \
            --build-arg BUILD_GID="$(id -g)" \
            -t venom-os-archiso-builder .

      - name: Compilar ISO com Archiso oficial
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            venom-os-archiso-builder

      - name: Verificar e calcular hash da ISO
        run: |
          shopt -s nullglob
          isos=(work/out/*.iso)
          if (( ${#isos[@]} == 0 )); then
            echo "Nenhuma ISO foi gerada." >&2
            exit 1
          fi
          file "${isos[@]}"
          sha256sum "${isos[@]}" | tee work/venom-iso-sha256.txt

      - name: Publicar ISO e hash como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: venom-os-archiso
          path: |
            work/out/*.iso
            work/venom-iso-sha256.txt
          if-no-files-found: error
          retention-days: 1
