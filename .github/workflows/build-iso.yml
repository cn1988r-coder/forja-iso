name: Build Forja ISO

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Base da ISO
        required: true
        type: choice
        options:
          - manjaro
          - arch
        default: manjaro
      desktop:
        description: Ambiente gráfico
        required: true
        type: choice
        options:
          - mate
          - xfce
          - gnome
        default: mate
      kernel:
        description: Kernel
        required: true
        type: choice
        options:
          - lts
          - latest
        default: lts

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar sintaxe dos scripts
        run: |
          bash -n build-cloud.sh build-arch.sh build-manjaro.sh build-shelly.sh

      - name: Selecionar imagem de compilação
        id: image
        shell: bash
        run: |
          if [[ "${{ inputs.distribution }}" == "arch" ]]; then
            echo "name=archlinux:latest" >> "$GITHUB_OUTPUT"
          else
            echo "name=manjarolinux/base:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar imagem base
        run: docker pull "${{ steps.image.outputs.name }}"

      - name: Preparar saída
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Compilar ISO
        env:
          FORJA_DISTRIBUTION: ${{ inputs.distribution }}
          FORJA_DESKTOP: ${{ inputs.desktop }}
          FORJA_KERNEL: ${{ inputs.kernel }}
        run: |
          docker run --rm --privileged --network host \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/forja-ci" \
            -v "$GITHUB_WORKSPACE/output:/forja-output" \
            -e FORJA_DISTRIBUTION \
            -e FORJA_DESKTOP \
            -e FORJA_KERNEL \
            -e FORJA_OUTPUT=/forja-output \
            "${{ steps.image.outputs.name }}" \
            bash /forja-ci/build-cloud.sh

      - name: Publicar ISO e checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forja-${{ inputs.distribution }}-${{ inputs.desktop }}-${{ inputs.kernel }}
          path: |
            output/*.iso
            output/*.sha256
            output/build-info.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
