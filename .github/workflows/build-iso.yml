name: Compilar ISO Forja OS

on:
  workflow_dispatch:
  push:
    branches: [main, fix/forja-calamares-stability]
    paths:
      - "Dockerfile"
      - "scripts/build-forja-iso.sh"
      - "scripts/build-container.sh"
      - "build/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

concurrency:
  group: forja-os-iso-build-v2
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Diagnóstico inicial do runner
        run: |
          set -euxo pipefail
          echo "Commit: $GITHUB_SHA"
          echo "Workspace: $GITHUB_WORKSPACE"
          df -h "$GITHUB_WORKSPACE"
          free -h
          nproc
          docker version

      - name: Construir ambiente Arch com repositórios EndeavourOS
        run: |
          docker build --pull \
            --build-arg BUILD_UID="$(id -u)" \
            --build-arg BUILD_GID="$(id -g)" \
            -t forja-os-iso-builder .

      - name: Compilar ISO com mkarchiso
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            forja-os-iso-builder

      - name: Verificar e calcular hash da ISO
        run: |
          shopt -s nullglob
          isos=(work/EndeavourOS-ISO/out/*.iso)
          if (( ${#isos[@]} == 0 )); then
            echo "Nenhuma ISO foi gerada." >&2
            exit 1
          fi
          file "${isos[@]}"
          sha256sum "${isos[@]}" | tee work/forja-iso-sha256.txt

      - name: Publicar ISO e hash como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: forja-os-iso
          path: |
            work/EndeavourOS-ISO/out/*.iso
            work/forja-iso-sha256.txt
          if-no-files-found: error
          retention-days: 1
