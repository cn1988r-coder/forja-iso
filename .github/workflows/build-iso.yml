name: Legacy snapshot build disabled

# Branch histórica. A arquitetura ativa usa Archiso e Calamares online
# nas três branches canônicas documentadas em README.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Build disabled
        run: |
          echo "Esta branch é somente histórica; nenhuma ISO pode ser gerada aqui."
          exit 1
