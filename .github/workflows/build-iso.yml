name: Compilar ISO VENOM OS

# Bloqueio intencional: nenhuma compilação de ISO pode ocorrer enquanto
# o instalador próprio VENOM não estiver implementado, validado e autorizado.
# O workflow permanece visível para auditoria, mas não aceita gatilhos de push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iso:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Compilação bloqueada por decisão do projeto
        run: |
          echo "Build bloqueada: instalador próprio VENOM ainda não foi implementado e validado."
          echo "A compilação também depende de autorização expressa do usuário."
          exit 1
