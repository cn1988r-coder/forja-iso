name: VENOM OS | Build Arch ISO

on:
  push:
    branches:
      - feature/venom-os-xfce-stable
    paths:
      - "build/**"
      - "installer/**"
      - "scripts/**"
      - "Dockerfile"
      - ".github/workflows/build-venom-arch-iso.yml"
  workflow_dispatch:
    inputs:
      confirm_iso_build:
        description: Confirmar a compilação da ISO VENOM OS XFCE
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: venom-iso-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_iso_build == true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Arch build container
        run: |
          docker build --pull -t venom-os-arch-builder:latest .

      - name: Build VENOM ISO
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc 'sudo -E bash scripts/build-venom-iso.sh'

      - name: BIOS boot smoke test
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc '
              ISO="$(find out -type f -name "*.iso" -print -quit)"
              set +e
              timeout 240s qemu-system-x86_64 -machine accel=tcg -m 4096 -smp 2 -vga std \
                -cdrom "$ISO" -boot d -display none -serial file:bios-serial.log \
                -monitor none -no-reboot -no-shutdown
              STATUS=$?
              set -e
              if [[ "$STATUS" -ne 124 ]]; then
                echo "[BIOS] QEMU terminou inesperadamente: status=$STATUS"
                cat bios-serial.log || true
                exit 1
              fi
              if ! grep -Fq VENOM_LIVE_SETUP_STARTED bios-serial.log || ! grep -Fq VENOM_LIVE_READY bios-serial.log; then
                echo "[BIOS] Marcadores do ambiente Live ausentes. Log serial completo:"
                cat bios-serial.log || true
                exit 1
              fi
            '

      - name: UEFI boot smoke test
        run: |
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc '
              ISO="$(find out -maxdepth 1 -type f -name "*.iso" -print -quit)"
              OVMF_CODE="$(find /usr/share/edk2 -type f -iname "OVMF_CODE*.fd" | head -n 1)"
              OVMF_VARS="$(find /usr/share/edk2 -type f -iname "OVMF_VARS*.fd" | head -n 1)"
              test -n "$OVMF_CODE" && test -n "$OVMF_VARS"
              cp "$OVMF_VARS" /tmp/OVMF_VARS.fd
              set +e
              timeout 240s qemu-system-x86_64 -machine q35,accel=tcg -m 4096 -smp 2 -vga std \
                -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
                -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
                -cdrom "$ISO" -boot d -display none -serial file:uefi-serial.log \
                -monitor none -no-reboot -no-shutdown
              STATUS=$?
              set -e
              if [[ "$STATUS" -ne 124 ]]; then
                echo "[UEFI] QEMU terminou inesperadamente: status=$STATUS"
                cat uefi-serial.log || true
                exit 1
              fi
              if ! grep -Fq VENOM_LIVE_SETUP_STARTED uefi-serial.log || ! grep -Fq VENOM_LIVE_READY uefi-serial.log; then
                echo "[UEFI] Marcadores do ambiente Live ausentes. Log serial completo:"
                cat uefi-serial.log || true
                exit 1
              fi
            '

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: venom-os-arch-iso
          path: |
            out/**/*.iso
            out/**/*.sha256
          if-no-files-found: error
          retention-days: 14
