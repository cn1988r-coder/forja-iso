name: Validar VENOM OS

on:
  push:
    branches:
      - optimize/venom-iso-size
    paths:
      - "AGENTS.md"
      - "Dockerfile"
      - "README.md"
      - "build/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar dentro do ambiente Arch Linux
        run: bash scripts/build-container.sh
