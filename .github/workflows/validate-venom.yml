name: Validar VENOM OS Manjaro

on:
  push:
    branches:
      - optimize/venom-iso-size
    paths:
      - "manjaro/venom-mate/**"
      - "scripts/manjaro-mate-dark-complete.sh"
      - "scripts/build-venom-iso.sh"
      - "scripts/validate-manjaro-profile.sh"
      - "README.md"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar perfil Manjaro e script original
        run: bash scripts/validate-manjaro-profile.sh
