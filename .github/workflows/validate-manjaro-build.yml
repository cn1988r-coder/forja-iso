name: Preflight do perfil Manjaro MATE VENOM (sem compilação)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: venom-manjaro-preflight
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ferramentas de validação
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validar scripts e perfil
        run: |
          shellcheck -S error scripts/prepare-manjaro-profile.sh scripts/validate-manjaro-profile.sh scripts/validate-manjaro-build.sh scripts/build-manjaro-iso.sh scripts/test-manjaro-profile-links.sh
          scripts/prepare-manjaro-profile.sh
          scripts/validate-manjaro-profile.sh
      - name: Conferir integração com os perfis oficiais Manjaro
        run: scripts/test-manjaro-profile-links.sh
      - name: Limite desta validação
        run: |
          echo "Preflight estático concluído. Nenhum pacote foi resolvido e nenhuma ISO foi compilada."
          echo "A resolução real deve ser executada em ambiente Manjaro com ferramentas e repositórios oficiais."
