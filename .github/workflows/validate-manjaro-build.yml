name: VENOM OS XFCE - Fluxo de configuracao

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuracao:
    name: Configuracao do XFCE (sem testes ou build)
    runs-on: ubuntu-24.04
    steps:
      - name: Informar escopo autorizado
        run: |
          echo "Fluxo reservado ao acompanhamento da configuracao do VENOM OS XFCE."
          echo "Nenhum teste, validacao, compilacao, construcao de pacote ou ISO sera executado."
          echo "A configuracao do XFCE deve ser editada diretamente no repositorio.";
