name: Build Manjaro VENOM MATE ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manjaro-venom-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout VENOM OS
        uses: actions/checkout@v4

      - name: Validate Manjaro profile and exact DeepSeek script
        run: bash scripts/validate-manjaro-profile.sh

      - name: Configure Manjaro tools to use this profile checkout
        run: |
          sudo install -d -m 0755 /root/.config/manjaro-tools
          printf 'run_dir=%s/iso-profiles\n' "$GITHUB_WORKSPACE" | sudo tee /root/.config/manjaro-tools/iso-profiles.conf

      - name: Build Manjaro ISO with official Manjaro tooling
        id: manjaro-build
        uses: manjaro/manjaro-iso-action@main
        with:
          iso-profiles-repo: https://github.com/cn1988r-coder/forja-iso
          iso-profiles-branch: optimize/venom-iso-size
          edition: venom-mate
          branch: stable
          scope: full
          kernel: linux618

      - name: Publish temporary build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VENOM-OS-Manjaro-MATE-ISO
          path: |
            ${{ steps.manjaro-build.outputs.file-path }}
            ${{ steps.manjaro-build.outputs.file-path }}.pkgs
          if-no-files-found: error
          retention-days: 3
