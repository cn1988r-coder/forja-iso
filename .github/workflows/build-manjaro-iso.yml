name: Construir e validar VENOM OS

on:
  push:
    branches:
      - optimize/venom-iso-size
  pull_request:
    branches:
      - optimize/venom-iso-size
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venom-manjaro-build
  cancel-in-progress: false

jobs:
  profile-quality:
    name: Auditoria estrutural do perfil VENOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar código da VENOM OS
        uses: actions/checkout@v4

      - name: Instalar ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validar scripts e perfil MATE
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck -S error scripts/prepare-manjaro-profile.sh scripts/validate-manjaro-profile.sh scripts/validate-manjaro-build.sh scripts/build-manjaro-iso.sh scripts/test-manjaro-profile-links.sh
          bash scripts/prepare-manjaro-profile.sh
          bash scripts/validate-manjaro-profile.sh
          bash scripts/test-manjaro-profile-links.sh

  manjaro-iso:
    name: Construção real da ISO no Manjaro
    needs: profile-quality
    runs-on: [self-hosted, linux, manjaro, x64]
    timeout-minutes: 360
    steps:
      - name: Baixar código da VENOM OS
        uses: actions/checkout@v4

      - name: Confirmar ambiente e ferramentas oficiais
        shell: bash
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          [[ "${ID:-}" == manjaro ]] || {
            echo "O runner precisa executar Manjaro Linux." >&2
            exit 1
          }
          command -v pacman
          command -v buildiso
          command -v shellcheck
          pacman -Qo "$(command -v buildiso)"
          pacman -Q manjaro-tools-iso
          pacman -Q manjaro-keyring
          pacman -Si linux618
          pacman -Si calamares

      - name: Validar novamente o perfil no ambiente de construção
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck -S error scripts/prepare-manjaro-profile.sh scripts/validate-manjaro-profile.sh scripts/validate-manjaro-build.sh scripts/build-manjaro-iso.sh scripts/test-manjaro-profile-links.sh
          bash scripts/prepare-manjaro-profile.sh
          bash scripts/validate-manjaro-profile.sh
          bash scripts/test-manjaro-profile-links.sh

      - name: Construir imagens e gerar a ISO VENOM OS
        shell: bash
        env:
          VENOM_ISO_APPROVED: YES
          VENOM_ISO_OUTPUT_DIR: ${{ runner.temp }}/venom-iso
        run: |
          set -Eeuo pipefail
          bash scripts/build-manjaro-iso.sh

      - name: Publicar artefato de teste da ISO
        uses: actions/upload-artifact@v4
        with:
          name: venom-os-mate-iso
          path: ${{ runner.temp }}/venom-iso/
          if-no-files-found: error
          retention-days: 14
