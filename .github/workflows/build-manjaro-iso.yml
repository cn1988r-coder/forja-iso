name: Validar VENOM OS com ferramentas oficiais Manjaro (geração de ISO bloqueada)

on:
  push:
    branches:
      - optimize/venom-iso-size
  pull_request:
    branches:
      - optimize/venom-iso-size

permissions:
  contents: read

concurrency:
  group: venom-manjaro-build
  cancel-in-progress: false

jobs:
  gitrepo-quality:
    name: Testes upstream do GitRepo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar VENOM OS e GitRepo fixado
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de teste GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            python3-gi \
            python3-pytest \
            python3-requests \
            python3-rich \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-secret-1 \
            xvfb \
            pipx

      - name: Conferir versão upstream fixada
        run: |
          set -Eeuo pipefail
          test -f vendor/gitrepo/LICENSE
          test -f vendor/gitrepo/pyproject.toml
          test -d vendor/gitrepo/tests
          git -C vendor/gitrepo rev-parse HEAD
          git -C vendor/gitrepo status --short

      - name: Corrigir callback de confirmação no GitRepo fixado
        working-directory: vendor/gitrepo
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py")
          source = path.read_text()
          lines = source.splitlines()
          matches = [
              index
              for index, line in enumerate(lines)
              if line.strip() == 'dialog.connect("closed", lambda _alert: self._apply_resolutions())'
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Esperado exatamente um callback upstream para corrigir; encontrados: {len(matches)}"
              )
          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = indent + "from gi.repository import GLib"
          lines.insert(index + 1, indent + 'print("VENOM_DIAG: delete response callback entered", flush=True)')
          lines.insert(index + 2, indent + "def _apply_after_alert():")
          lines.insert(index + 3, indent + '    print("VENOM_DIAG: idle callback entered", flush=True)')
          lines.insert(index + 4, indent + '    print("VENOM_DIAG: before apply_resolutions", flush=True)')
          lines.insert(index + 5, indent + "    try:")
          lines.insert(index + 6, indent + "        self._apply_resolutions()")
          lines.insert(index + 7, indent + '        print(f"VENOM_DIAG: after apply_resolutions visible={self.get_visible()}", flush=True)')
          lines.insert(index + 8, indent + "    except BaseException as error:")
          lines.insert(index + 9, indent + '        print(f"VENOM_DIAG: apply_resolutions raised {type(error).__name__}: {error}", flush=True)')
          lines.insert(index + 10, indent + "    return GLib.SOURCE_REMOVE")
          lines.insert(index + 11, indent + "GLib.idle_add(_apply_after_alert)")
          path.write_text("\n".join(lines) + "\n")
          PY
          grep -Fq 'GLib.idle_add(_apply_after_alert)' usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py

      - name: Formatação e análise estática do GitRepo
        working-directory: vendor/gitrepo
        run: |
          set -Eeuo pipefail
          # O código-fonte do GitRepo segue o formatter; os testes upstream são mantidos intactos.
          pipx run ruff format usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py
          pipx run ruff format --check usr/share
          pipx run ruff check usr/share tests

      - name: Diagnosticar teste de exclusão do GitRepo
        working-directory: vendor/gitrepo
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/gitrepo/usr/share
        run: xvfb-run -a python3 -m pytest -vv -s tests/build_package/test_conflict_dialog_deletion.py::test_delete_and_apply_closes_the_dialog

  manjaro-preflight:
    name: Pré-validação no Manjaro
    needs: gitrepo-quality
    runs-on: [self-hosted, linux, manjaro, x64]
    timeout-minutes: 360
    steps:
      - name: Baixar VENOM OS e ferramentas upstream fixadas
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirmar ferramentas upstream disponíveis
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f vendor/gitrepo/LICENSE
          test -f vendor/gitrepo/usr/bin/biso
          test -f vendor/gitrepo/usr/share/gitrepo/build_iso/core/iso_builder.py
          git -C vendor/gitrepo rev-parse HEAD

      - name: Confirmar ambiente oficial Manjaro
        shell: bash
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          [[ "${ID:-}" == manjaro ]] || {
            echo "O runner precisa executar Manjaro Linux." >&2
            exit 1
          }
          command -v pacman
          command -v buildiso
          command -v shellcheck
          pacman -Qo "$(command -v buildiso)"
          pacman -Q manjaro-tools-iso
          pacman -Q linux618
          pacman -Q manjaro-keyring

      - name: Validar scripts e perfil MATE
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck -S error scripts/prepare-manjaro-profile.sh scripts/validate-manjaro-profile.sh scripts/validate-manjaro-build.sh scripts/build-manjaro-iso.sh scripts/test-manjaro-profile-links.sh
          scripts/prepare-manjaro-profile.sh
          scripts/validate-manjaro-profile.sh
          scripts/test-manjaro-profile-links.sh

      - name: Resolver dependências sem compilar ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/venom-logs"
          set -o pipefail
          scripts/validate-manjaro-build.sh 2>&1 | tee "$RUNNER_TEMP/venom-logs/package-resolution.log"

      - name: Guardar logs de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-preflight-logs
          path: ${{ runner.temp }}/venom-logs/
          if-no-files-found: ignore
          retention-days: 14
