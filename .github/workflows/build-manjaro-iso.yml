name: Validar VENOM OS com ferramentas oficiais Manjaro (geração de ISO bloqueada)

on:
  push:
    branches:
      - optimize/venom-iso-size
  pull_request:
    branches:
      - optimize/venom-iso-size

permissions:
  contents: read

concurrency:
  group: venom-manjaro-build
  cancel-in-progress: false

jobs:
  gitrepo-quality:
    name: Testes upstream do GitRepo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar VENOM OS e GitRepo fixado
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de teste GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gettext \
            python3-gi \
            python3-pytest \
            python3-requests \
            python3-rich \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-secret-1 \
            xvfb \
            pipx

      - name: Conferir versão upstream fixada
        run: |
          set -Eeuo pipefail
          test -f vendor/gitrepo/LICENSE
          test -f vendor/gitrepo/pyproject.toml
          test -d vendor/gitrepo/tests
          git -C vendor/gitrepo rev-parse HEAD
          git -C vendor/gitrepo status --short

      - name: Corrigir fechamento da janela de conflitos no GitRepo fixado
        working-directory: vendor/gitrepo
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py")
          source = path.read_text()

          init_line = "        super().__init__(transient_for=parent, modal=True)"
          if source.count(init_line) != 1:
              raise SystemExit("Esperada exatamente uma inicialização de ConflictDialog")
          source = source.replace(
              init_line,
              init_line + "\n        self.set_hide_on_close(True)",
              1,
          )

          import_line = "from gi.repository import Adw, GObject, Gtk, Pango"
          if source.count(import_line) != 1:
              raise SystemExit("Esperada exatamente uma linha de imports GTK")
          source = source.replace(import_line, "from gi.repository import Adw, GLib, GObject, Gtk, Pango", 1)

          callback_line = '            dialog.connect("closed", lambda _alert: self._apply_resolutions())'
          if source.count(callback_line) != 1:
              raise SystemExit("Esperado exatamente um callback upstream de confirmação")
          source = source.replace(
              callback_line,
              '            GLib.idle_add(lambda: (self._apply_resolutions(), GLib.SOURCE_REMOVE)[1])',
              1,
          )

          close_block = '        self.emit("conflicts-resolved", success)\\n        self.close()'
          if source.count(close_block) != 1:
              raise SystemExit("Esperado exatamente um fechamento após resolver conflitos")
          source = source.replace(
              close_block,
              '        self.emit("conflicts-resolved", success)\\n        self.close()\\n        self.set_visible(False)',
              1,
          )
          path.write_text(source)
          PY
          grep -Fq 'self.set_hide_on_close(True)' usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py
          grep -Fq 'GLib.idle_add' usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py
          grep -Fq 'self.close()' usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py
          grep -Fq 'self.set_visible(False)' usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py

      - name: Formatação e análise estática do GitRepo
        working-directory: vendor/gitrepo
        run: |
          set -Eeuo pipefail
          # O código-fonte do GitRepo segue o formatter; os testes upstream são mantidos intactos.
          pipx run ruff format usr/share/gitrepo/build_package/gui/dialogs/conflict_dialog.py
          pipx run ruff format --check usr/share
          pipx run ruff check usr/share tests

      - name: Testes upstream completos do GitRepo
        working-directory: vendor/gitrepo
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor/gitrepo/usr/share
          GTK_A11Y: none
        run: xvfb-run -a python3 -m pytest -vv

  manjaro-preflight:
    name: Pré-validação no Manjaro
    needs: gitrepo-quality
    runs-on: [self-hosted, linux, manjaro, x64]
    timeout-minutes: 360
    steps:
      - name: Baixar VENOM OS e ferramentas upstream fixadas
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirmar ferramentas upstream disponíveis
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f vendor/gitrepo/LICENSE
          test -f vendor/gitrepo/usr/bin/biso
          test -f vendor/gitrepo/usr/share/gitrepo/build_iso/core/iso_builder.py
          git -C vendor/gitrepo rev-parse HEAD

      - name: Confirmar ambiente oficial Manjaro
        shell: bash
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          [[ "${ID:-}" == manjaro ]] || {
            echo "O runner precisa executar Manjaro Linux." >&2
            exit 1
          }
          command -v pacman
          command -v buildiso
          command -v shellcheck
          pacman -Qo "$(command -v buildiso)"
          pacman -Q manjaro-tools-iso
          pacman -Q linux618
          pacman -Q manjaro-keyring

      - name: Validar scripts e perfil MATE
        shell: bash
        run: |
          set -Eeuo pipefail
          shellcheck -S error scripts/prepare-manjaro-profile.sh scripts/validate-manjaro-profile.sh scripts/validate-manjaro-build.sh scripts/build-manjaro-iso.sh scripts/test-manjaro-profile-links.sh
          scripts/prepare-manjaro-profile.sh
          scripts/validate-manjaro-profile.sh
          scripts/test-manjaro-profile-links.sh

      - name: Resolver dependências sem compilar ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/venom-logs"
          set -o pipefail
          scripts/validate-manjaro-build.sh 2>&1 | tee "$RUNNER_TEMP/venom-logs/package-resolution.log"

      - name: Guardar logs de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-preflight-logs
          path: ${{ runner.temp }}/venom-logs/
          if-no-files-found: ignore
          retention-days: 14
