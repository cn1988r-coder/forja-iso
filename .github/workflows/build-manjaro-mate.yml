name: Build Manjaro MATE ISO

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Kernel da ISO Manjaro MATE"
        required: true
        type: choice
        options:
          - lts
          - latest
        default: lts

permissions:
  contents: read

concurrency:
  group: manjaro-mate-iso-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Manjaro MATE
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh build-manjaro.sh build-shelly.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh build-shelly.sh

      - name: Authenticate Google Drive and prepare destination before build
        shell: bash
        env:
          GOOGLE_DRIVE_RCLONE_CONFIG: ${{ secrets.GOOGLE_DRIVE_RCLONE_CONFIG }}
          KERNEL: ${{ inputs.kernel }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${GOOGLE_DRIVE_RCLONE_CONFIG:-}" ]]; then
            echo "ERRO: falta o secret GOOGLE_DRIVE_RCLONE_CONFIG com a configuração OAuth do rclone para Google Drive. A compilação foi bloqueada antes de começar." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          config="$RUNNER_TEMP/rclone-google-drive.conf"
          printf '%s\\n' "$GOOGLE_DRIVE_RCLONE_CONFIG" > "$config"
          chmod 600 "$config"
          # Testa a autorização e prepara a pasta antes de consumir recursos com a ISO.
          rclone lsd gdrive: --config "$config"
          rclone mkdir "gdrive:Forja-ISO/Manjaro-MATE/$KERNEL" --config "$config"
          echo "Google Drive autenticado e destino preparado."

      - name: Free disk space for ISO build
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( available_kb < 25000000 )); then
            echo "ERRO: menos de 25 GB livres para a compilação Manjaro. Espaço disponível: $((available_kb / 1024 / 1024)) GB." >&2
            exit 1
          fi

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/forja-output"

      - name: Build Manjaro MATE ISO
        shell: bash
        env:
          FORJA_KERNEL: ${{ inputs.kernel }}
        run: |
          set -Eeuo pipefail
          docker pull manjarolinux/base:latest
          docker run --rm \
            --privileged \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -v "$GITHUB_WORKSPACE/forja-output:/forja-output" \
            -e FORJA_DISTRIBUTION=manjaro \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL="$FORJA_KERNEL" \
            -e FORJA_OUTPUT=/forja-output \
            manjarolinux/base:latest \
            bash -lc 'bash /forja-ci/build-cloud.sh'

      - name: Verify ISO and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t isos < <(find forja-output -type f -name '*.iso' -size +100M)
          if (( ${#isos[@]} != 1 )); then
            echo "ERRO: esperado exatamente uma ISO válida; encontradas: ${#isos[@]}" >&2
            find forja-output -type f -printf '%p (%s bytes)\\n'
            exit 1
          fi
          iso="${isos[0]}"
          checksum_file="${iso}.sha256"
          test -s "$checksum_file"
          (cd "$(dirname "$iso")" && sha256sum --check "$(basename "$checksum_file")")
          test -s forja-output/build-info.txt
          grep -Fxq 'DESKTOP=mate' forja-output/build-info.txt
          grep -Fxq 'BASE=Manjaro' forja-output/build-info.txt
          echo "iso=$iso" >> "$GITHUB_OUTPUT"

      - name: Upload verified ISO to Google Drive
        shell: bash
        env:
          ISO_PATH: ${{ steps.verify.outputs.iso }}
          KERNEL: ${{ inputs.kernel }}
        run: |
          set -Eeuo pipefail
          test -s "$RUNNER_TEMP/rclone-google-drive.conf"
          config="$RUNNER_TEMP/rclone-google-drive.conf"
          remote="gdrive:Forja-ISO/Manjaro-MATE/$KERNEL/$GITHUB_RUN_ID"
          iso_dir="$(dirname "$ISO_PATH")"
          iso_name="$(basename "$ISO_PATH")"
          # Envia a ISO integral, checksum e metadados para o Google Drive.
          rclone copy "$iso_dir" "$remote" \
            --config "$config" \
            --include "$iso_name" \
            --include "$iso_name.sha256" \
            --include "build-info.txt" \
            --checksum \
            --transfers 2 \
            --checkers 4 \
            --retries 3 \
            --low-level-retries 10 \
            --stats 30s
          rclone ls "$remote" --config "$config"
          echo "Upload concluído: $remote"
          rm -f "$config"

      - name: Remove temporary Google Drive configuration
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rclone-google-drive.conf"
