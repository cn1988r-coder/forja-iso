name: Build Manjaro MATE ISO

on:
  # A fila é consultada automaticamente; builds diretos ficam restritos ao dispatch.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      kernel:
        description: "Kernel da ISO Manjaro MATE"
        required: true
        type: choice
        options:
          - lts
          - latest
        default: lts
  repository_dispatch:
    types: [forja-build]

permissions:
  contents: write

concurrency:
  group: manjaro-mate-iso-build
  cancel-in-progress: false

jobs:
  check-queue:
    if: github.event_name == 'schedule'
    name: Check Forja build queue
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      request_id: ${{ steps.claim.outputs.request_id }}
      kernel: ${{ steps.claim.outputs.kernel }}
    steps:
      - name: Check for a queued ISO request
        id: claim
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/claim', {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({})
            });
            if (!response.ok) {
              throw new Error(`Forja queue returned HTTP ${response.status}: ${await response.text()}`);
            }
            const result = await response.json();
            if (result.job) {
              core.setOutput('request_id', result.job.id);
              core.setOutput('kernel', result.job.kernel);
              core.info(`Claimed Forja request ${result.job.id}`);
            } else {
              core.setOutput('request_id', '');
              core.setOutput('kernel', '');
              core.info('No pending Forja ISO requests.');
            }

  build:
    needs: check-queue
    if: ${{ always() && (github.event_name != 'schedule' || needs.check-queue.outputs.request_id != '') }}
    name: Build Manjaro MATE
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
    env:
      FORJA_KERNEL: ${{ inputs.kernel || github.event.client_payload.kernel || needs.check-queue.outputs.kernel || 'lts' }}
      FORJA_REQUEST_ID: ${{ needs.check-queue.outputs.request_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build scripts and request
        shell: bash
        env:
          FORJA_KERNEL: ${{ inputs.kernel || github.event.client_payload.kernel || needs.check-queue.outputs.kernel || 'lts' }}
        run: |
          set -euo pipefail
          case "$FORJA_KERNEL" in
            lts|latest) ;;
            *) echo "Kernel inválido: $FORJA_KERNEL" >&2; exit 2 ;;
          esac
          bash -n build-cloud.sh build-manjaro.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh

      - name: Authenticate MEGA and prepare destination before build
        shell: bash
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          KERNEL: ${{ env.FORJA_KERNEL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${MEGA_EMAIL:-}" || -z "${MEGA_PASSWORD:-}" ]]; then
            echo "ERRO: cadastre MEGA_EMAIL e MEGA_PASSWORD nos Secrets do repositório. A compilação foi bloqueada antes de começar." >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          if ! rclone help backends | grep -Eq '(^|[[:space:]])mega([[:space:]]|$)'; then
            echo "Versão do rclone sem suporte ao MEGA; instalando a versão oficial atual." >&2
            curl --fail --location --silent --show-error https://rclone.org/install.sh | sudo bash
          fi
          if ! rclone help backends | grep -Eq '(^|[[:space:]])mega([[:space:]]|$)'; then
            echo "ERRO: rclone não disponibiliza o backend MEGA neste runner." >&2
            exit 1
          fi
          config="$RUNNER_TEMP/rclone-mega.conf"
          rm -f "$config"
          rclone config create mega mega user "$MEGA_EMAIL" pass "$MEGA_PASSWORD" --config "$config"
          chmod 600 "$config"
          rclone lsd mega: --config "$config"
          remote="mega:Forja-ISO/Manjaro-MATE/$KERNEL/$GITHUB_RUN_ID"
          rclone mkdir "$remote" --config "$config"
          echo "MEGA autenticado e destino preparado: $remote"

      - name: Free disk space for ISO build
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /
          available_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if (( available_kb < 25000000 )); then
            echo "ERRO: menos de 25 GB livres para a compilação Manjaro. Espaço disponível: $((available_kb / 1024 / 1024)) GB." >&2
            exit 1
          fi

      - name: Report preparation progress
        if: ${{ env.FORJA_REQUEST_ID != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/update', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: process.env.FORJA_REQUEST_ID, status: 'running', progress: 15, stage: 'Ambiente de compilação preparado' })
            });
            if (!response.ok) throw new Error(`Forja status update failed: ${await response.text()}`);

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/forja-output"

      - name: Build Manjaro MATE ISO
        id: build_iso
        shell: bash
        env:
          FORJA_KERNEL: ${{ inputs.kernel || github.event.client_payload.kernel || needs.check-queue.outputs.kernel || 'lts' }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/forja-manjaro"
          work_fs="$(stat -f -c %T "$RUNNER_TEMP/forja-manjaro")"
          echo "Filesystem da área de trabalho: $work_fs"
          if [[ "$work_fs" == overlayfs || "$work_fs" == fuse.* ]]; then
            echo "ERRO: RUNNER_TEMP não oferece filesystem adequado para upperdir OverlayFS." >&2
            exit 1
          fi
          docker pull manjarolinux/base:latest
          docker run --rm \
            --privileged \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -v "$GITHUB_WORKSPACE/forja-output:/forja-output" \
            -v "$RUNNER_TEMP/forja-manjaro:/tmp/forja-manjaro" \
            -e FORJA_DISTRIBUTION=manjaro \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL="$FORJA_KERNEL" \
            -e FORJA_OUTPUT=/forja-output \
            manjarolinux/base:latest \
            bash -lc 'bash /forja-ci/build-cloud.sh'

      - name: Report ISO image creation
        if: ${{ success() && env.FORJA_REQUEST_ID != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/update', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: process.env.FORJA_REQUEST_ID, status: 'running', progress: 78, stage: 'Imagem ISO criada; verificando integridade' })
            });
            if (!response.ok) throw new Error(`Forja status update failed: ${await response.text()}`);

      - name: Verify ISO and checksum
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t isos < <(find forja-output -type f -name '*.iso' -size +1000M)
          if (( ${#isos[@]} != 1 )); then
            echo "ERRO: esperado exatamente uma ISO completa maior que 1 GB; encontradas: ${#isos[@]}" >&2
            find forja-output -type f -printf '%p (%s bytes)\\n'
            exit 1
          fi
          iso="${isos[0]}"
          checksum_file="${iso}.sha256"
          test -s "$checksum_file"
          (cd "$(dirname "$iso")" && sha256sum --check "$(basename "$checksum_file")")
          size_bytes="$(stat -c '%s' "$iso")"
          test -s forja-output/build-info.txt
          grep -Fxq 'DESKTOP=mate' forja-output/build-info.txt
          grep -Fxq 'BASE=Manjaro' forja-output/build-info.txt
          grep -Fxq 'COMPRESSION=xz' forja-output/build-info.txt
          echo "iso=$iso" >> "$GITHUB_OUTPUT"

      - name: Upload verified ISO to MEGA
        id: mega_upload
        shell: bash
        env:
          ISO_PATH: ${{ steps.verify.outputs.iso }}
          KERNEL: ${{ env.FORJA_KERNEL }}
        run: |
          set -Eeuo pipefail
          config="$RUNNER_TEMP/rclone-mega.conf"
          test -s "$config"
          remote="mega:Forja-ISO/Manjaro-MATE/$KERNEL/$GITHUB_RUN_ID"
          iso_name="$(basename "$ISO_PATH")"
          test -s "$ISO_PATH.sha256"
          test -s forja-output/build-info.txt

          # MEGA não fornece hashes ao rclone; a integridade local já foi
          # validada por sha256sum. Aqui a cópia remota é conferida por tamanho.
          rclone copyto "$ISO_PATH" "$remote/$iso_name" \
            --config "$config" --retries 3 --low-level-retries 10 --stats 30s
          rclone copyto "$ISO_PATH.sha256" "$remote/$iso_name.sha256" \
            --config "$config" --retries 3 --low-level-retries 10 --stats 30s
          rclone copyto "forja-output/build-info.txt" "$remote/build-info.txt" \
            --config "$config" --retries 3 --low-level-retries 10 --stats 30s

          rclone lsjson "$remote" --config "$config" > "$RUNNER_TEMP/mega-files.json"
          python3 - "$ISO_PATH" "$RUNNER_TEMP/mega-files.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          iso = Path(sys.argv[1])
          entries = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected = {
              iso.name: iso.stat().st_size,
              iso.name + ".sha256": Path(str(iso) + ".sha256").stat().st_size,
              "build-info.txt": Path("forja-output/build-info.txt").stat().st_size,
          }
          actual = {
              entry["Name"]: int(entry["Size"])
              for entry in entries
              if not entry.get("IsDir", False)
          }
          for name, size in expected.items():
              if actual.get(name) != size:
                  raise SystemExit(
                      f"ERRO: arquivo MEGA ausente ou com tamanho divergente: "
                      f"{name}; esperado={size}; remoto={actual.get(name)}"
                  )
          print("ISO, checksum e metadados conferidos no MEGA por tamanho.")
          PY

          mega_url="$(rclone link "$remote/$iso_name" --config "$config" | tail -n 1)"
          if [[ "$mega_url" != https://mega.nz/* ]]; then
            echo "ERRO: o MEGA não retornou um link público válido para a ISO." >&2
            exit 1
          fi
          echo "download_url=$mega_url" >> "$GITHUB_OUTPUT"
          echo "remote_path=$remote" >> "$GITHUB_OUTPUT"
          echo "Upload MEGA verificado: $remote"

      - name: Report ISO validation
        if: ${{ success() && env.FORJA_REQUEST_ID != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/update', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: process.env.FORJA_REQUEST_ID, status: 'running', progress: 92, stage: 'Integridade e checksum validados' })
            });
            if (!response.ok) throw new Error(`Forja status update failed: ${await response.text()}`);

      - name: Publish optional GitHub fallback release (24 hours)
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_PATH: ${{ steps.verify.outputs.iso }}
        run: |
          set -Eeuo pipefail
          tag="forja-mate-temp-${GITHUB_RUN_ID}"
          filename="$(basename "$ISO_PATH")"
          gh release create "$tag" "$ISO_PATH" "$ISO_PATH.sha256" forja-output/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "FORJA OS Manjaro MATE temporária" \
            --notes "ISO completa em arquivo único. Esta publicação será removida automaticamente após 24 horas."
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$filename"
          remote_size="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$filename\") | .size")"
          local_size="$(stat -c '%s' "$ISO_PATH")"
          test -n "$remote_size"
          test "$remote_size" = "$local_size"
          curl --fail --location --silent --show-error --range 0-0 "$url" -o /dev/null
          echo "download_url=$url" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish MEGA download link to Forja panel
        if: ${{ success() && env.FORJA_REQUEST_ID != '' }}
        uses: actions/github-script@v7
        env:
          MEGA_DOWNLOAD_URL: ${{ steps.mega_upload.outputs.download_url }}
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/update', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: process.env.FORJA_REQUEST_ID,
                status: 'complete',
                progress: 100,
                stage: 'ISO compilada; link MEGA gerado',
                downloadUrl: process.env.MEGA_DOWNLOAD_URL
              })
            });
            if (!response.ok) throw new Error(`Forja completion update failed: ${await response.text()}`);

      - name: Add MEGA download link to workflow summary
        if: ${{ success() }}
        shell: bash
        env:
          MEGA_DOWNLOAD_URL: ${{ steps.mega_upload.outputs.download_url }}
          GITHUB_FALLBACK_URL: ${{ steps.publish_release.outputs.download_url }}
          KERNEL: ${{ env.FORJA_KERNEL }}
        run: |
          set -Eeuo pipefail
          test -n "$MEGA_DOWNLOAD_URL"
          {
            echo "## ISO FORJA OS MATE pronta"
            echo
            echo "- **Kernel:** $KERNEL"
            echo "- **Arquivo:** ISO completa, sem divisão em partes"
            echo "- **Destino principal:** MEGA"
            echo
            echo "[**BAIXAR A ISO NO MEGA**]($MEGA_DOWNLOAD_URL)"
            if [[ -n "$GITHUB_FALLBACK_URL" ]]; then
              echo
              echo "- **Espelho alternativo:** GitHub Releases, temporário por 24 horas"
              echo "[Baixar pelo espelho temporário do GitHub]($GITHUB_FALLBACK_URL)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark Forja request as failed
        if: ${{ failure() && env.FORJA_REQUEST_ID != '' }}
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const token = await core.getIDToken('forja-iso-worker');
            const response = await fetch('https://forja-de-iso-l9adzj.v2.appdeploy.ai/api/worker/update', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                id: process.env.FORJA_REQUEST_ID,
                status: 'failed',
                progress: 0,
                stage: 'A compilação falhou',
                error: 'A compilação, a validação da ISO ou a publicação do arquivo falhou. Abra os logs para identificar a etapa e a mensagem exata.',
                detailsUrl: process.env.RUN_URL
              })
            });
            if (!response.ok) core.warning(`Could not report failure to Forja: ${await response.text()}`);

      - name: Remove temporary MEGA configuration
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rclone-mega.conf" "$RUNNER_TEMP/mega-files.json"

