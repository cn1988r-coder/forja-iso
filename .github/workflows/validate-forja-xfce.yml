name: Validate Forja OS XFCE interface

on:
  push:
    branches:
      - forja-xfce-interface
      - feature/forja-xfce-store-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-xfce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh
          bash -n build-manjaro.sh
          bash -n desktops/xfce/apply-forja-layout.sh
          bash -n desktops/xfce/install-branding.sh

      - name: Validate SVG and desktop entry
        run: |
          python - <<'PY'
          import configparser
          import xml.etree.ElementTree as ET
          ET.parse("desktops/xfce/forja-flame.svg")
          wallpaper = ET.parse("desktops/xfce/forja-xfce-wallpaper.svg").getroot()
          wallpaper_text = "".join(wallpaper.itertext())
          assert "FORJA OS" in wallpaper_text
          assert "FORGE" not in wallpaper_text and "ARCH LINUX" not in wallpaper_text
          config = configparser.ConfigParser(interpolation=None)
          config.read("desktops/xfce/forja-xfce-appearance.desktop")
          entry = config["Desktop Entry"]
          assert entry["Exec"] == "/usr/lib/forja/apply-xfce-layout.sh"
          assert entry["OnlyShowIn"] == "XFCE;"
          PY

      - name: Validate XFCE module wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FORJA_DESKTOP:-mate' build-cloud.sh
          grep -q 'mate|xfce' build-cloud.sh
          grep -q 'DESKTOP="\${FORJA_DESKTOP:-mate}"' build-manjaro.sh
          grep -q 'desktops/xfce/packages.manjaro' build-manjaro.sh
          grep -q 'desktops/xfce/install-branding.sh' build-manjaro.sh
          grep -q 'xfce4-docklike-plugin' desktops/xfce/packages.manjaro
          grep -q 'xfce4-whiskermenu-plugin' desktops/xfce/packages.manjaro
          grep -q 'Papirus-Dark' desktops/xfce/apply-forja-layout.sh
          grep -q 'papirus-folders -C grey --theme Papirus-Dark' build-manjaro.sh
          grep -q 'forja-papirus-folders.service' build-manjaro.sh
          grep -q '^papirus-folders
          grep -q 'Bibata-Modern-Classic' desktops/xfce/apply-forja-layout.sh
          grep -q 'forja-os-xfce.svg' desktops/xfce/apply-forja-layout.sh
          grep -q '^flatpak
 desktops/xfce/packages.manjaro
          grep -q '^yay
 desktops/xfce/packages.manjaro
          grep -q '^base-devel
 desktops/xfce/packages.manjaro
          grep -q '^git
 desktops/xfce/packages.manjaro
          grep -q 'OnlyShowIn=MATE;XFCE;' forja-pamac-pacman/forja-update-indicator.desktop
          grep -q 'forja-pamac-pacman/install.sh' build-manjaro.sh
          python3 -m py_compile forja-pamac-pacman/src/forja-store forja-pamac-pacman/src/forja-pacman-transaction forja-pamac-pacman/src/forja-update-indicator
          bash -n forja-pamac-pacman/install.sh
 desktops/xfce/packages.manjaro
          grep -q 'Bibata-Modern-Classic' desktops/xfce/apply-forja-layout.sh
          grep -q 'forja-os-xfce.svg' desktops/xfce/apply-forja-layout.sh
          grep -q '^flatpak
 desktops/xfce/packages.manjaro
          grep -q '^yay
 desktops/xfce/packages.manjaro
          grep -q '^base-devel
 desktops/xfce/packages.manjaro
          grep -q '^git
 desktops/xfce/packages.manjaro
          grep -q 'OnlyShowIn=MATE;XFCE;' forja-pamac-pacman/forja-update-indicator.desktop
          grep -q 'forja-pamac-pacman/install.sh' build-manjaro.sh
          python3 -m py_compile forja-pamac-pacman/src/forja-store forja-pamac-pacman/src/forja-pacman-transaction forja-pamac-pacman/src/forja-update-indicator
          bash -n forja-pamac-pacman/install.sh
