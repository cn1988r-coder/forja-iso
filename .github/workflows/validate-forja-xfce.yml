name: Validate Forja OS XFCE

on:
  push:
    branches:
      - feature/forja-xfce-store-integration
    paths:
      - 'desktops/xfce/**'
      - 'build-manjaro.sh'
      - '.github/workflows/validate-forja-xfce.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-xfce-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-xfce-profile:
    name: Validate XFCE source (no ISO build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          find desktops/xfce -type f \( -name '*.sh' -o -name 'profile.conf' \) -print0 |
            while IFS= read -r -d '' file; do
              bash -n "$file"
              echo "BASH_OK: $file"
            done
          bash -n build-manjaro.sh

      - name: Validate XFCE appearance and integration
        shell: bash
        run: bash desktops/xfce/tests/validate-appearance.sh

      - name: Validate XML files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = sorted(Path("desktops/xfce").rglob("*.xml"))
          if not files:
              raise SystemExit("ERRO: nenhum XML do perfil XFCE foi encontrado.")
          for path in files:
              ET.parse(path)
              print(f"XML_OK: {path}")
          PY

      - name: Validate required XFCE profile assets
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            desktops/xfce/packages.manjaro
            desktops/xfce/profile.conf
            desktops/xfce/panel-default.xml
            desktops/xfce/forja-gtk.css
            desktops/xfce/forja-whiskermenu.rc
            desktops/xfce/install-branding.sh
            desktops/xfce/apply-forja-layout.sh
            desktops/xfce/shelly-autostart.desktop
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "ERRO: arquivo obrigatório ausente/vazio: $file"; exit 1; }
            echo "ASSET_OK: $file"
          done
