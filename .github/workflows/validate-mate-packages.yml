name: Validate Forja MATE packages

concurrency:
  group: validate-forja-mate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - feature/forja-arch-mate
    paths:
      - "desktop/mate/**"
      - "bases/archlinux/**"
      - "DESKTOP-STRATEGY.md"
      - ".github/workflows/validate-mate-packages.yml"
  pull_request:
    paths:
      - "desktop/mate/**"
      - ".github/workflows/validate-mate-packages.yml"
  workflow_dispatch:

jobs:
  package-resolution:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Arch package databases and install validation tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm python base-devel shadow gtk3 python-gobject python-cairo xorg-server-xvfb xorg-xauth dbus

      - name: Validate package names and dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          list="desktop/mate/packages.x86_64"
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' "$list")

          if (("${#packages[@]}" == 0)); then
            echo "Package list is empty." >&2
            exit 1
          fi

          official_packages=()
          for package in "${packages[@]}"; do
            case "$package" in
              calamares|brisk-menu|bibata-cursor-theme-bin)
                recipe="build-support/$package/PKGBUILD"
                test -s "$recipe" || { echo "Missing local recipe: $recipe" >&2; exit 1; }
                bash -n "$recipe"
                printf 'FOUND local Forja package recipe %s\\n' "$package"
                ;;
              *)
                if pacman -Si "$package" >/dev/null 2>&1 || pacman -Sgq "$package" >/dev/null 2>&1; then
                  printf 'FOUND %s\\n' "$package"
                  official_packages+=("$package")
                else
                  echo "MISSING $package" >&2
                  exit 1
                fi
                ;;
            esac
          done

          if (("${#official_packages[@]}" > 0)); then
            pacman -Sp --needed --print-format '%n %v' -- "${official_packages[@]}" | tee /tmp/mate-transaction.txt
          fi

          base_list="bases/archlinux/packages.x86_64"
          mapfile -t base_packages < <(grep -Ev '^[[:space:]]*(#|$)' "$base_list")
          if (("${#base_packages[@]}" == 0)); then
            echo "Arch base package list is empty." >&2
            exit 1
          fi
          for package in "${base_packages[@]}"; do
            if pacman -Si "$package" >/dev/null 2>&1 || pacman -Sgq "$package" >/dev/null 2>&1; then
              printf 'FOUND Arch base package %s\\n' "$package"
            else
              echo "MISSING Arch base package $package" >&2
              exit 1
            fi
          done
          pacman -Sp --needed --print-format '%n %v' -- "${base_packages[@]}" | tee /tmp/arch-base-transaction.txt
          bash -n bases/archlinux/profiledef.sh
          bash -n bases/archlinux/build-profile.sh
          bash -n bases/archlinux/airootfs/root/customize_airootfs.sh
          bash -n desktop/mate/install-target.sh
          python -m json.tool bases/archlinux/airootfs/etc/archinstall/forja-mate.json >/dev/null
          bash -n bases/archlinux/validate-profile.sh
          bash bases/archlinux/validate-profile.sh
          pacman-conf --config bases/archlinux/pacman.conf --repo-list

          bash -n desktop/mate/apply-defaults.sh
          bash -n desktop/mate/install-iptvnator.sh
          bash -n desktop/mate/install-forja-update-indicator.sh
          bash -n desktop/mate/install-forja-store.sh
          bash -n desktop/mate/install-forja-monitor.sh
          bash -n desktop/mate/forja-repo/forja-repo
          bash -n desktop/mate/forja-store/forja-aur-build
          bash -n desktop/mate/forja-store/PKGBUILD
          bash -n desktop/mate/forja-repo/PKGBUILD
          bash -n desktop/mate/scripts/validate-packages.sh
          python -m py_compile desktop/mate/forja-update-indicator/forja-update-indicator.py
          python -m py_compile desktop/mate/forja-monitor/forja-monitor.py
          python -m py_compile desktop/mate/forja-monitor/record-install-time.py
          install_test_root="$(mktemp -d)"
          python desktop/mate/forja-monitor/record-install-time.py --root "$install_test_root" --installed-at "2026-11-16T12:34:56-03:00"
          python - "$install_test_root" <<'PY'
          import json, pathlib, sys
          marker = pathlib.Path(sys.argv[1]) / "var/lib/forja-os/install-info.json"
          data = json.loads(marker.read_text())
          assert data["installed_at"] == "2026-11-16T12:34:56-03:00", data
          assert marker.stat().st_mode & 0o777 == 0o644, oct(marker.stat().st_mode & 0o777)
          PY
          if python desktop/mate/forja-monitor/record-install-time.py --root "$install_test_root" --installed-at "2026-11-17T00:00:00-03:00"; then
            echo "Install timestamp marker was unexpectedly overwritten." >&2
            exit 1
          fi
          rm -rf "$install_test_root"
          xvfb-run -a dbus-run-session -- python desktop/mate/forja-monitor/forja-monitor.py --self-test
          monitor_root="$(mktemp -d)"
          bash desktop/mate/install-forja-monitor.sh "$monitor_root"
          test -x "$monitor_root/usr/bin/forja-monitor"
          test -s "$monitor_root/usr/share/forja-monitor/forja-flame.svg"
          test -s "$monitor_root/usr/share/applications/forja-monitor.desktop"
          rm -rf "$monitor_root"
          python -m py_compile desktop/mate/forja-store/forja-store.py
          python -m py_compile desktop/mate/forja-store/forja-pacman-transaction
          xvfb-run -a dbus-run-session -- python desktop/mate/forja-store/forja-store.py --self-test
          python - <<'PY'
          import xml.etree.ElementTree as ET
          policy = ET.parse("desktop/mate/forja-store/br.forja.store.policy").getroot()
          action = policy.find("action")
          assert action is not None and action.attrib["id"] == "br.forja.store.manage-packages"
          rule = open("desktop/mate/forja-store/49-forja-store.rules", encoding="utf-8").read()
          assert 'action.id === "br.forja.store.manage-packages"' in rule
          assert 'action.lookup("program") === "/usr/bin/forja-pacman-transaction"' in rule
          PY
          useradd --create-home builder
          chown -R builder:builder desktop/mate/forja-store
          runuser -u builder -- bash -lc 'cd desktop/mate/forja-store && makepkg --nodeps --noconfirm'
          package="$(find desktop/mate/forja-store -maxdepth 1 -name 'forja-store-*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm --nodeps "$package"
          pacman -Qk forja-store
          test -s /usr/share/polkit-1/rules.d/49-forja-store.rules
          grep -q 'forja-pacman-transaction' /usr/share/polkit-1/rules.d/49-forja-store.rules
          store_root="$(mktemp -d)"
          bash desktop/mate/install-forja-store.sh "$store_root"
          test -x "$store_root/usr/bin/forja-store"
          test -s "$store_root/etc/polkit-1/rules.d/49-forja-store.rules"
          rm -rf "$store_root"
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk"
          if /usr/bin/forja-pacman-transaction invalid-action; then
            echo "The transaction helper accepted an invalid action." >&2
            exit 1
          fi

          python - <<'PY'
          import runpy
          from unittest.mock import patch

          helper = runpy.run_path("desktop/mate/forja-store/forja-pacman-transaction")
          main = helper["main"]

          with patch.object(helper["subprocess"], "call", return_value=0) as call:
              assert main(["install", "firefox"]) == 0
              assert call.call_args.args[0] == [
                  "/usr/bin/pacman", "-S", "--needed", "--noconfirm", "--", "firefox"
              ]

          with patch.object(helper["subprocess"], "call", return_value=0) as call:
              assert main(["upgrade"]) == 0
              assert call.call_args.args[0] == [
                  "/usr/bin/pacman", "-Syu", "--noconfirm"
              ]

          with patch.object(helper["subprocess"], "call", return_value=0) as call:
              assert main(["remove", "firefox"]) == 0
              assert call.call_args.args[0] == [
                  "/usr/bin/pacman", "-Rns", "--noconfirm", "--", "firefox"
              ]

          with patch.object(helper["subprocess"], "call", side_effect=[0, 0]) as call:
              assert main(["flatpak-install-system", "org.mozilla.firefox"]) == 0
              assert call.call_args_list[0].args[0] == [
                  "/usr/bin/flatpak", "remote-add", "--if-not-exists",
                  "--system", "flathub", "https://flathub.org/repo/flathub.flatpakrepo"
              ]
              assert call.call_args_list[1].args[0] == [
                  "/usr/bin/flatpak", "install", "--system",
                  "--noninteractive", "--assumeyes", "flathub", "org.mozilla.firefox"
              ]

          with patch.object(helper["subprocess"], "call", return_value=0) as call:
              assert main(["flatpak-remove-system", "org.mozilla.firefox"]) == 0
              assert call.call_args.args[0] == [
                  "/usr/bin/flatpak", "uninstall", "--system",
                  "--noninteractive", "--assumeyes", "org.mozilla.firefox"
              ]

          with patch.object(helper["subprocess"], "call") as call:
              assert main(["flatpak-remove-system", "invalid-id"]) == 2
              call.assert_not_called()

          store = open("desktop/mate/forja-store/forja-store.py", encoding="utf-8").read()
          assert '"flatpak", "search"' in store
          assert '"flatpak", "install"' in store
          assert 'flatpak-remove-system' in store
          assert 'forja-aur-build' in store
          print("Forja Store source integration tests passed.")
          PY
