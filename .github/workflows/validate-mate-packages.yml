name: Validate Forja MATE packages

on:
  push:
    branches:
      - foundation/dual-base
    paths:
      - "desktop/mate/**"
      - ".github/workflows/validate-mate-packages.yml"
  pull_request:
    paths:
      - "desktop/mate/**"
      - ".github/workflows/validate-mate-packages.yml"
  workflow_dispatch:

jobs:
  package-resolution:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Arch package databases and install validation tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm python base-devel shadow gtk3 python-gobject python-cairo xorg-server-xvfb xorg-xauth dbus

      - name: Validate package names and dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          list="desktop/mate/packages.x86_64"
          mapfile -t packages < <(grep -Ev '^[[:space:]]*(#|$)' "$list")

          if (("${#packages[@]}" == 0)); then
            echo "Package list is empty." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            if pacman -Si "$package" >/dev/null 2>&1 || pacman -Sgq "$package" >/dev/null 2>&1; then
              printf 'FOUND %s\n' "$package"
            else
              echo "MISSING $package" >&2
              exit 1
            fi
          done

          pacman -Sp --needed --print-format '%n %v' -- "${packages[@]}" | tee /tmp/mate-transaction.txt

          bash -n desktop/mate/apply-defaults.sh
          bash -n desktop/mate/install-iptvnator.sh
          bash -n desktop/mate/install-forja-update-indicator.sh
          bash -n desktop/mate/install-forja-store.sh
          bash -n desktop/mate/install-forja-monitor.sh
          bash -n desktop/mate/forja-store/forja-aur-build
          bash -n desktop/mate/forja-store/PKGBUILD
          bash -n desktop/mate/scripts/validate-packages.sh
          python -m py_compile desktop/mate/forja-update-indicator/forja-update-indicator.py
          python -m py_compile desktop/mate/forja-monitor/forja-monitor.py
          python -m py_compile desktop/mate/forja-monitor/record-install-time.py
          install_test_root="$(mktemp -d)"
          python desktop/mate/forja-monitor/record-install-time.py --root "$install_test_root" --installed-at "2026-11-16T12:34:56-03:00"
          python - "$install_test_root" <<'PY'
          import json, pathlib, sys
          marker = pathlib.Path(sys.argv[1]) / "var/lib/forja-os/install-info.json"
          data = json.loads(marker.read_text())
          assert data["installed_at"] == "2026-11-16T12:34:56-03:00", data
          assert marker.stat().st_mode & 0o777 == 0o644, oct(marker.stat().st_mode & 0o777)
          PY
          if python desktop/mate/forja-monitor/record-install-time.py --root "$install_test_root" --installed-at "2026-11-17T00:00:00-03:00"; then
            echo "Install timestamp marker was unexpectedly overwritten." >&2
            exit 1
          fi
          rm -rf "$install_test_root"
          xvfb-run -a dbus-run-session -- python desktop/mate/forja-monitor/forja-monitor.py --self-test
          monitor_root="$(mktemp -d)"
          bash desktop/mate/install-forja-monitor.sh "$monitor_root"
          test -x "$monitor_root/usr/bin/forja-monitor"
          test -s "$monitor_root/usr/share/forja-monitor/forja-flame.svg"
          test -s "$monitor_root/usr/share/applications/forja-monitor.desktop"
          rm -rf "$monitor_root"
          python -m py_compile desktop/mate/forja-store/forja-store.py
          python -m py_compile desktop/mate/forja-store/forja-pacman-transaction
          python -c "import xml.etree.ElementTree as ET; ET.parse('desktop/mate/forja-store/br.forja.store.policy')"
          useradd --create-home builder
          chown -R builder:builder desktop/mate/forja-store
          runuser -u builder -- bash -lc 'cd desktop/mate/forja-store && makepkg --nodeps --noconfirm'
          package="$(find desktop/mate/forja-store -maxdepth 1 -name 'forja-store-*.pkg.tar.zst' -print -quit)"
          test -n "$package"
          pacman -U --noconfirm --nodeps "$package"
          pacman -Qk forja-store
          python -c "import gi; gi.require_version('Gtk', '3.0'); from gi.repository import Gtk"
          if /usr/bin/forja-pacman-transaction invalid-action; then
            echo "The transaction helper accepted an invalid action." >&2
            exit 1
          fi
