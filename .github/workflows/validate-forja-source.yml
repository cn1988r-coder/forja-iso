name: Validate Forja OS source (no ISO build)

on:
  push:
    branches:
      - main
      - feature/forja-xfce-endeavouros-port
    paths:
      - 'profiles/forja-xfce/**'
      - 'desktops/xfce/**'
      - '.github/workflows/validate-forja-source.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'profiles/forja-xfce/**'
      - 'desktops/xfce/**'
      - '.github/workflows/validate-forja-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Forja XFCE source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Forja OS XFCE EndeavourOS source
        uses: actions/checkout@v4
        with:
          ref: feature/forja-xfce-endeavouros-port

      - name: Install XML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate XFCE profile, packages and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          bash profiles/forja-xfce/tests/validate-profile.sh
          xmllint --noout desktops/xfce/panel-default.xml
          xmllint --noout desktops/xfce/forja-xfce-desktop.xml
          python3 -m py_compile \
            profiles/forja-xfce/forja-packages/forja-recovery/forja-recovery-cli \
            profiles/forja-xfce/forja-packages/forja-recovery/forja-recovery-gui \
            profiles/forja-xfce/airootfs/usr/local/bin/forja-update
          rm -rf \
            profiles/forja-xfce/forja-packages/forja-recovery/__pycache__ \
            profiles/forja-xfce/airootfs/usr/local/bin/__pycache__
          echo "Validação Forja XFCE concluída. Nenhuma ISO foi compilada."
