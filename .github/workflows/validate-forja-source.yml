name: Validate Forja OS source (no ISO build)

on:
  push:
    branches:
      - main
      - feature/forja-xfce-store-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Forja XFCE source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Forja XFCE source
        uses: actions/checkout@v4
        with:
          ref: feature/forja-xfce-store-integration

      - name: Validate shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in \
            build-cloud.sh build-manjaro.sh \
            desktops/xfce/apply-forja-layout.sh \
            desktops/xfce/install-branding.sh \
            desktops/xfce/tests/validate-appearance.sh \
            forja-pamac-pacman/build-pamac.sh \
            forja-pamac-pacman/install.sh; do
            bash -n "$script"
          done

      - name: Validate Python source and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q forja-pamac-pacman/src forja-pamac-pacman/tests
          python3 -m unittest discover -s forja-pamac-pacman/tests -v

      - name: Validate Forja desktop configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash desktops/xfce/tests/validate-appearance.sh
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in (
              Path("desktops/xfce/panel-default.xml"),
              Path("desktops/xfce/forja-xfce-desktop.xml"),
          ):
              ET.parse(path)
              print(f"XML OK: {path}")
          PY
      - name: Validate Manjaro pacman and mirror configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("build-manjaro.sh").read_text()
          def heredoc(tag, destination):
              prefix = f"""install -Dm644 /dev/stdin "$TARGET/rootfs/{destination}" <<'{tag}'"""
              lines = source.splitlines()
              start = lines.index(prefix)
              end = lines.index(tag, start + 1)
              path = Path("/tmp") / Path(destination).name
              path.write_text("\\n".join(lines[start + 1:end]) + "\\n")
              return path

          pacman = heredoc("PACMANCONF", "etc/pacman.conf")
          mirrors = heredoc("MIRRORSCONF", "etc/pacman-mirrors.conf")
          service = heredoc("MIRRORSERVICE", "etc/systemd/system/forja-manjaro-mirrors.service")

          conf = pacman.read_text()
          assert "[core]" in conf and "[extra]" in conf
          assert conf.count("Include = /etc/pacman.d/mirrorlist") == 2
          assert "Server =" not in conf
          mirror_conf = mirrors.read_text()
          assert "Branch = stable" in mirror_conf
          assert "Protocols = https,http" in mirror_conf
          unit = service.read_text()
          assert "ExecStart=/usr/bin/pacman-mirrors --fasttrack 10" in unit
          assert "After=network-online.target" in unit
          assert "Before=display-manager.service" in unit
          assert "Restart=on-failure" in unit
          assert "pacman-mirrors" in source.split("BASE_CORE_PACKAGES=(", 1)[1].split(")", 1)[0]
          assert 'ln -sfn ../forja-manjaro-mirrors.service' in source
          assert 'pacman-mirrors --fasttrack 10' in source
          assert 'grep -Eq \'^[[:space:]]*Server[[:space:]]*=[[:space:]]*https?://\'' in source
          print("Manjaro pacman.conf, stable mirror branch, HTTPS mirror preference and first-boot mirror service validated.")
          PY
          systemd-analyze verify /tmp/forja-manjaro-mirrors.service

