name: Validate Forja OS MATE source (no ISO build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate Forja MATE source and build prerequisites
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Forja OS MATE source
        uses: actions/checkout@v4
        with:
          ref: feature/forja-manjaro-mate

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils

      - name: Validate MATE source
        shell: bash
        run: |
          set -Eeuo pipefail
          bash desktops/mate/tests/validate-profile.sh
          bash -n build-manjaro.sh
          bash -n build-cloud.sh
          shellcheck -S warning -e SC1091 build-manjaro.sh build-cloud.sh
          desktop-file-validate desktops/mate/panel-launchers/*.desktop
          python3 -c 'import json, xml.etree.ElementTree as ET; json.load(open("desktops/mate/fastfetch/config.jsonc")); ET.parse("desktops/mate/panel-launchers/forja-menu.svg")'
          echo "Validação de origem concluída. Nenhuma ISO foi compilada."
