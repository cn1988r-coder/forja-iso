name: VENOM OS - Preparar ambiente Ubuntu

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venom-ubuntu-runner-preparation
  cancel-in-progress: false

jobs:
  prepare-runner:
    # Runner hospedado pelo GitHub. O ambiente e descartável ao fim do job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Obter o código da VENOM OS
        uses: actions/checkout@v4

      - name: Preparar utilitários básicos do ambiente
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            git curl wget xz-utils squashfs-tools dosfstools mtools

      - name: Preparar diretórios de trabalho
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/venom-workspace/source"
          mkdir -p "$HOME/venom-workspace/cache"
          mkdir -p "$HOME/venom-workspace/chroots"
          mkdir -p "$HOME/venom-workspace/logs"
          mkdir -p "$HOME/venom-workspace/output"

      - name: Registrar fonte do projeto no workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_WORKSPACE" > "$HOME/venom-workspace/source/repository-path.txt"

      # BLOQUEIO DESTA ETAPA:
      # Não instalar nem executar ferramentas de construção do Manjaro.
      # Não executar buildiso, buildpkg, buildtree ou check-yaml.
      # Não criar chroots, gerar ISO, executar testes ou validações.
      # O ambiente Ubuntu hospedado pelo GitHub é temporário e não equivale
      # a uma máquina Manjaro persistente.
