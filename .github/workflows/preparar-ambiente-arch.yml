name: Preparar máquina de compilação Arch Linux

on:
  workflow_dispatch:
  push:
    branches:
      - feature/venom-os-xfce-stable
    paths:
      - ".github/workflows/preparar-ambiente-arch.yml"
      - "Dockerfile"

permissions:
  contents: read

concurrency:
  group: venom-arch-build-machine
  cancel-in-progress: false

jobs:
  preparar-arch-docker:
    name: Preparar ambiente Arch Linux para futura ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar repositório VENOM OS
        uses: actions/checkout@v4

      - name: Verificar recursos do runner
        run: |
          set -euo pipefail
          docker version
          df -h "$GITHUB_WORKSPACE"
          nproc
          free -h

      - name: Construir imagem de ferramentas Arch Linux
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg BUILD_UID="$(id -u)" \
            --build-arg BUILD_GID="$(id -g)" \
            -t venom-os-arch-builder:latest .

      - name: Preparar e verificar ferramentas do ambiente
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc '
              set -euo pipefail
              printf "VENOM OS: ambiente Arch Linux preparado.\\n"
              pacman -Q archiso base-devel git squashfs-tools dosfstools libisoburn mtools grub efibootmgr rsync curl wget arch-install-scripts xorriso python python-pip btrfs-progs
              printf "Arquitetura: "; uname -m
              printf "Espaço disponível: "; df -h /workspace | tail -n 1
              printf "Ambiente pronto para receber o perfil Arch da VENOM OS.\\n"
              printf "Esta etapa NÃO compila nem gera a ISO.\\n"
            '
