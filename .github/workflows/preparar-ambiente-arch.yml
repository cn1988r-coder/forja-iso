name: Preparar ambiente Arch Linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venom-arch-environment
  cancel-in-progress: false

jobs:
  preparar-arch:
    name: Criar ambiente temporário Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório VENOM OS
        uses: actions/checkout@v4

      - name: Preparar imagem Arch Linux
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg BUILD_UID="$(id -u)" \
            --build-arg BUILD_GID="$(id -g)" \
            -t venom-os-arch-builder:latest .

      - name: Iniciar ambiente Arch Linux
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc '
              printf "Ambiente Arch Linux da VENOM OS iniciado.\\n"
              printf "Arquitetura: "
              uname -m
              printf "Diretório de trabalho: "
              pwd
              printf "Usuário do ambiente: "
              whoami
              printf "Ambiente temporário pronto. Nenhuma ISO será compilada.\\n"
            '
