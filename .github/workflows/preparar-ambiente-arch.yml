name: Preparar máquina Docker Arch Linux

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: venom-arch-docker-environment
  cancel-in-progress: false

jobs:
  preparar-arch-docker:
    name: Criar ambiente Arch Linux em Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar repositório VENOM OS
        uses: actions/checkout@v4

      - name: Confirmar Docker disponível no runner
        run: |
          set -euo pipefail
          docker version
          df -h "$GITHUB_WORKSPACE"

      - name: Construir imagem Docker Arch Linux
        run: |
          set -euo pipefail
          docker build --pull \
            --build-arg BUILD_UID="$(id -u)" \
            --build-arg BUILD_GID="$(id -g)" \
            -t venom-os-arch-builder:latest .

      - name: Preparar ambiente Arch para uso no job
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            venom-os-arch-builder:latest \
            /bin/bash -lc '
              printf "VENOM OS: ambiente Docker Arch Linux pronto.\\n"
              printf "Kernel do runner: "
              uname -r
              printf "Ferramentas disponíveis:\\n"
              pacman -Q archiso base-devel git squashfs-tools xorriso
              printf "Workspace: %s\\n" "$PWD"
              printf "Nenhuma ISO foi compilada neste workflow.\\n"
            '
