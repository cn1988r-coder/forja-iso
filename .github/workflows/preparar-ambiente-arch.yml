name: Preparar ambiente Arch Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-ambiente:
    name: Preparar ferramentas do Arch Linux
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Atualizar banco de pacotes
        run: pacman -Syu --noconfirm

      - name: Instalar ferramentas do ambiente
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            archiso \
            squashfs-tools \
            dosfstools \
            libisoburn \
            mtools \
            grub \
            efibootmgr \
            rsync \
            curl \
            wget \
            arch-install-scripts \
            xorriso

      - name: Registrar resumo do ambiente
        run: |
          printf 'Ambiente Arch Linux preparado.\n'
          printf 'Nenhuma compilação, geração de ISO ou validação foi executada.\n'
          pacman -Q base-devel git archiso squashfs-tools dosfstools libisoburn mtools grub efibootmgr rsync curl wget arch-install-scripts xorriso
