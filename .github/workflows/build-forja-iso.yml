name: Forja OS XFCE ISO

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-guard:
    name: Confirmar branch da compilação
    runs-on: ubuntu-latest
    steps:
      - name: Exigir a branch XFCE EndeavourOS
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_REF_NAME}" != "feature/forja-xfce-endeavouros-port" ]]; then
            echo "::error::Selecione a branch feature/forja-xfce-endeavouros-port no campo Branch antes de iniciar."
            exit 1
          fi
          echo "Branch correta selecionada. O workflow completo da branch XFCE será executado."
