name: Forja OS XFCE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-forja-iso.yml'

permissions:
  contents: read

concurrency:
  group: forja-xfce-iso-build
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build Forja OS XFCE ISO
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged
    timeout-minutes: 360
    steps:
      - name: Checkout Forja OS EndeavourOS branch
        uses: actions/checkout@v4
        with:
          ref: feature/forja-xfce-endeavouros-port

      - name: Confirm active Forja source
        shell: bash
        run: |
          set -Eeuo pipefail
          # actions/checkout downloads a source archive inside this Arch container,
          # so no .git directory or git executable exists at this stage.
          # The checkout ref above is pinned to the approved XFCE branch.
          test -f profiles/forja-xfce/prepare-forja.sh
          test -f profiles/forja-xfce/prepare.sh
          test -f profiles/forja-xfce/packages.x86_64
          test -f profiles/forja-xfce/profiledef.sh
          test -f profiles/forja-xfce/run_before_squashfs.sh
          test -f desktops/xfce/panel-default.xml
          ! grep -q 'forja-pamac-pacman' .github/workflows/build-forja-iso.yml
          echo "Fonte confirmada: feature/forja-xfce-endeavouros-port, Forja OS XFCE sobre EndeavourOS"

      - name: Configure Arch and EndeavourOS repositories
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman-key --init
          pacman -Syu --noconfirm --needed ca-certificates curl git sudo wget
          install -d /etc/pacman.d
          curl -fsSL https://raw.githubusercontent.com/endeavouros-team/EndeavourOS-ISO/main/pacman.conf -o /etc/pacman.conf
          printf '%s\n' 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          curl -fsSL https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS/master/endeavouros-mirrorlist/endeavouros-mirrorlist -o /etc/pacman.d/endeavouros-mirrorlist
          pacman-key --populate archlinux
          pacman-key --recv-key 0F20FADC599D1C46EB556455AED8858E4B9813F1 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 0F20FADC599D1C46EB556455AED8858E4B9813F1
          pacman-key --recv-key 497AF50C92AD2384C56E1ACA003DB8B0CB23504F --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 497AF50C92AD2384C56E1ACA003DB8B0CB23504F
          pacman -Sy --noconfirm endeavouros-keyring endeavouros-mirrorlist
          pacman -Syu --noconfirm --needed \
            archiso arch-install-scripts squashfs-tools libisoburn dosfstools mtools \
            syslinux edk2-ovmf erofs-utils git wget curl sudo base-devel reflector jq

      - name: Create unprivileged package builder
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd --create-home --groups wheel builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Fetch official EndeavourOS ISO framework and prepare Forja profile
        shell: bash
        run: |
          set -Eeuo pipefail
          su builder -c 'git clone https://github.com/endeavouros-team/EndeavourOS-ISO.git /tmp/EndeavourOS-ISO'
          su builder -c 'git -C /tmp/EndeavourOS-ISO checkout --detach 0bbb1280ccd373262561453d85201f2707483990'
          test "$(su builder -c 'git -C /tmp/EndeavourOS-ISO rev-parse HEAD')" = "0bbb1280ccd373262561453d85201f2707483990"
          su builder -c "ENDEAVOUROS_ISO_DIR=/tmp/EndeavourOS-ISO bash '$GITHUB_WORKSPACE/profiles/forja-xfce/prepare-forja.sh'"
          test -x /tmp/EndeavourOS-ISO/forja-xfce-profile/mkarchiso
          test -f /tmp/EndeavourOS-ISO/forja-xfce-profile/profiledef.sh
          test -f /tmp/EndeavourOS-ISO/forja-xfce-profile/packages.x86_64
          test -f /tmp/EndeavourOS-ISO/forja-xfce-profile/run_before_squashfs.sh

      - name: Build Forja local packages
        shell: bash
        run: |
          set -Eeuo pipefail
          su builder -c 'cd /tmp/EndeavourOS-ISO/forja-xfce-profile && ./prepare.sh'
          mapfile -t local_packages < <(find /tmp/EndeavourOS-ISO/forja-xfce-profile/airootfs/root/packages -maxdepth 1 -type f -name '*.pkg.tar.zst' -print)
          (( ${#local_packages[@]} == 7 )) || {
            echo "Esperados sete pacotes locais Forja; encontrados: ${#local_packages[@]}" >&2
            exit 1
          }
          printf '%s\n' "${local_packages[@]}" | grep -q '/bibata-cursor-theme-'
          for package in "${local_packages[@]}"; do pacman -Qp "$package"; done

      - name: Compile Forja OS XFCE with mkarchiso
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/EndeavourOS-ISO/forja-xfce-profile
          ./mkarchiso -v .

      - name: Verify ISO and create SHA256
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          images=(/tmp/EndeavourOS-ISO/forja-xfce-profile/out/*.iso)
          (( ${#images[@]} == 1 )) || {
            echo "Esperada exatamente uma ISO; encontradas: ${#images[@]}" >&2
            exit 1
          }
          iso="${images[0]}"
          test -s "$iso"
          file "$iso" | grep -qi 'ISO 9660'
          xorriso -indev "$iso" -report_el_torito as_mkisofs
          sha256sum "$iso" > "$iso.sha256"
          stat --printf='ISO: %n%nTamanho: %s bytes\n' "$iso"
          cat "$iso.sha256"

      - name: Upload temporary Forja OS X XFCE ISO
        uses: actions/upload-artifact@v4
        with:
          name: forja-os-xfce-iso-${{ github.run_number }}
          path: |
            /tmp/EndeavourOS-ISO/forja-xfce-profile/out/*.iso
            /tmp/EndeavourOS-ISO/forja-xfce-profile/out/*.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove local ISO and temporary build files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/EndeavourOS-ISO
