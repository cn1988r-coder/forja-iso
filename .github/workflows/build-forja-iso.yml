name: Forja OS EndeavourOS XFCE profile checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/forja-xfce-endeavouros-port
    paths:
      - 'profiles/forja-xfce/**'
      - 'desktops/xfce/**'
      - 'build-cloud.sh'
      - '.github/workflows/build-forja-iso.yml'

permissions:
  contents: read

concurrency:
  group: forja-endeavour-xfce-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-profile:
    name: Validate EndeavourOS XFCE preparation (no ISO build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Forja OS source
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Validate EndeavourOS XFCE profile
        shell: bash
        run: |
          set -Eeuo pipefail
          bash profiles/forja-xfce/tests/validate-profile.sh
          xmllint --noout desktops/xfce/panel-default.xml
          xmllint --noout desktops/xfce/forja-xfce-desktop.xml

      - name: Confirm legacy Manjaro builder is disabled
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n build-cloud.sh
          if bash build-cloud.sh; then
            echo "ERRO: o wrapper legado não deveria iniciar um build." >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi

      - name: Confirm no ISO build was requested
        run: |
          echo "Validação estática concluída. Nenhuma ISO foi compilada."
