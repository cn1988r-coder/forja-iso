name: Build Forja OS Manjaro MATE LTS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-manjaro-mate-iso
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build Manjaro Stable MATE with LTS kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Forja OS
        uses: actions/checkout@v4
        with:
          ref: feature/forja-manjaro-mate

      - name: Validate MATE source before build
        shell: bash
        run: |
          set -Eeuo pipefail
          bash desktops/mate/tests/validate-profile.sh
          bash -n build-manjaro.sh
          bash -n build-cloud.sh

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/forja-output" "$RUNNER_TEMP/forja-work"

      - name: Build inside the official Manjaro base container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --privileged \
            --volume "$GITHUB_WORKSPACE:/forja-ci" \
            --volume "$GITHUB_WORKSPACE/forja-output:/forja-output" \
            --volume "$RUNNER_TEMP/forja-work:/forja-work" \
            --env FORJA_WORK=/forja-work \
            --env FORJA_DISTRIBUTION=manjaro \
            --env FORJA_DESKTOP=mate \
            --env FORJA_KERNEL=lts \
            --env FORJA_OUTPUT=/forja-output \
            manjarolinux/base:latest \
            bash -lc 'bash /forja-ci/build-cloud.sh'

      - name: Upload temporary ISO artifact (24 hours)
        uses: actions/upload-artifact@v4
        with:
          name: Forja-OS-Manjaro-MATE-LTS
          path: |
            forja-output/*.iso
            forja-output/**/*.iso
            forja-output/*.sha256
            forja-output/**/*.sha256
            forja-output/build-info.txt
          if-no-files-found: error
          retention-days: 1
