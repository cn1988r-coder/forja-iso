name: Build Forja OS Manjaro MATE LTS ISO

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-manjaro-mate-iso
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build Manjaro Stable MATE with LTS kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Forja OS
        uses: actions/checkout@v4
        with:
          ref: feature/forja-manjaro-mate

      - name: Identify exact Forja OS source revision
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Source branch: feature/forja-manjaro-mate"
          echo "Source commit: $(git rev-parse HEAD)"
          test -s desktops/mate/profile.conf
          test -s build-manjaro.sh

      - name: Validate MATE source before build
        shell: bash
        run: |
          set -Eeuo pipefail
          bash desktops/mate/tests/validate-profile.sh
          bash -n build-manjaro.sh
          bash -n build-cloud.sh
          shellcheck -S warning -e SC1091 build-manjaro.sh build-cloud.sh
          desktop-file-validate desktops/mate/panel-launchers/*.desktop
          python3 -c 'import json, xml.etree.ElementTree as ET; json.load(open("desktops/mate/fastfetch/config.jsonc")); ET.parse("desktops/mate/panel-launchers/forja-menu.svg")'

      - name: Prepare output directory
        run: mkdir -p "$GITHUB_WORKSPACE/forja-output"

      - name: Build inside the official Manjaro base container
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK_VOLUME="forja-mate-work-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$WORK_VOLUME" >/dev/null
          cleanup_work_volume() {
            docker volume rm -f "$WORK_VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup_work_volume EXIT
          DOCKER_ARGS=(
            --rm
            --privileged
            --mount "type=volume,source=${WORK_VOLUME},target=/forja-work"
            --volume "${GITHUB_WORKSPACE}:/forja-ci"
            --volume "${GITHUB_WORKSPACE}/forja-output:/forja-output"
            --env FORJA_WORK=/forja-work
            --env FORJA_DISTRIBUTION=manjaro
            --env FORJA_DESKTOP=mate
            --env FORJA_KERNEL=lts
            --env FORJA_OUTPUT=/forja-output
            manjarolinux/base:latest
            bash -lc 'bash /forja-ci/build-cloud.sh'
          )
          printf 'Docker image: %s\n' "${DOCKER_ARGS[-2]}"
          docker run "${DOCKER_ARGS[@]}"

      - name: Verify ISO and SHA-256 before publishing
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob globstar
          isos=(forja-output/**/*.iso)
          test "${#isos[@]}" -eq 1 || {
            echo "ERRO: esperado exatamente um arquivo ISO, encontrados: ${#isos[@]}" >&2
            exit 1
          }
          iso="${isos[0]}"
          test -s "$iso"
          test -s "$iso.sha256"
          test -s forja-output/build-info.txt
          (cd "$(dirname "$iso")" && sha256sum -c "$(basename "$iso").sha256")
          grep -Fxq 'BASE=Manjaro Stable' forja-output/build-info.txt
          grep -Fxq 'DESKTOP=mate' forja-output/build-info.txt
          grep -Fxq 'KERNEL=lts' forja-output/build-info.txt
          echo "ISO validada para publicação: $iso"

      - name: Upload temporary ISO artifact (24 hours)
        uses: actions/upload-artifact@v4
        with:
          name: Forja-OS-Manjaro-MATE-LTS
          path: |
            forja-output/*.iso
            forja-output/**/*.iso
            forja-output/*.sha256
            forja-output/**/*.sha256
            forja-output/build-info.txt
          if-no-files-found: error
          retention-days: 1
