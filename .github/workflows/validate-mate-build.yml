name: Validate Forja OS ISO Builder (code only)

on:
  push:
    branches:
      - forja-store-full-support
    paths:
      - 'build-manjaro.sh'
      - 'build-cloud.sh'
      - 'desktops/mate/**'
      - '.github/workflows/validate-mate-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'build-manjaro.sh'
      - 'build-cloud.sh'
      - 'desktops/mate/**'
      - '.github/workflows/validate-mate-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-iso-builder:
    name: Validate ISO generator only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout generator source
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: bash -n build-cloud.sh build-manjaro.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Analyze generator scripts with ShellCheck
        run: shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh

      - name: Validate ISO generator structure (no Store tests, no ISO build)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cloud = Path("build-cloud.sh").read_text()
          build = Path("build-manjaro.sh").read_text()

          assert re.search(r"^DESKTOP=mate$", build, re.M), "Generator target must be MATE"
          assert ': "${FORJA_KERNEL:?Defina FORJA_KERNEL}"' in cloud, "Cloud wrapper must require kernel selection"
          assert 'exec bash /forja-ci/build-manjaro.sh' in cloud, "Cloud wrapper must invoke the Manjaro generator"
          assert 'FORJA_DISTRIBUTION' in cloud and 'FORJA_DESKTOP' in cloud, "Cloud wrapper must reject unsupported targets"

          required = {
              "Manjaro package database refresh": "pacman -Syu --noconfirm",
              "Official Manjaro ISO profile retrieval": "iso-profiles.git",
              "MATE profile selection": 'TARGET="$PROFILE_ROOT/manjaro/forja-$DESKTOP"',
              "LightDM display manager": 'DM=lightdm',
              "MATE desktop package profile": "mate-session-manager",
              "Calamares installer package": "calamares",
              "NetworkManager service": "NetworkManager",
              "Bluetooth service": "'bluetooth'",
              "Kernel selection": 'KERNEL_PKG="$(python',
              "Preflight-only exit before build": 'FORJA_PREFLIGHT_ONLY:-0',
              "SquashFS wrapper": 'SQFS_WRAPPER_DIR="$WORK/squashfs-bin"',
              "XZ compression configuration": 'buildiso -f -d xz',
              "ISO output discovery": "find \"$OUT\" -type f -name '*.iso'",
              "Minimum ISO size check": 'SIZE >= 1000000000',
              "SHA256 generation": "sha256sum",
              "Build metadata report": 'build-info.txt',
              "Successful build marker": "BUILD_OK:",
          }
          for label, needle in required.items():
              assert needle in build, f"Missing generator component: {label}"

          buildiso_at = build.index("buildiso -f -d xz")
          preflight_at = build.index('FORJA_PREFLIGHT_ONLY:-0')
          assert preflight_at < buildiso_at, "Preflight-only mode must exit before invoking buildiso"

          print("PASS: cloud wrapper and ISO generator structure verified.")
          print("PASS: MATE profile, kernel selection, preflight, SquashFS, ISO checks and metadata verified.")
          print("PASS: no Store validation and no ISO compilation were run.")
          PY
