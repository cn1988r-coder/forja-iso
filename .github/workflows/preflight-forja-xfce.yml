name: Preflight Forja XFCE packages

on:
  push:
    branches:
      - feature/forja-xfce-endeavouros-port
    paths:
      - 'profiles/forja-xfce/**'
      - 'desktops/xfce/**'
      - '.github/workflows/preflight-forja-xfce.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-xfce-package-preflight
  cancel-in-progress: false

jobs:
  build-local-packages:
    name: Build and verify local XFCE packages (no ISO)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged
    timeout-minutes: 180
    steps:
      - name: Checkout Forja OS XFCE
        uses: actions/checkout@v4
        with:
          ref: feature/forja-xfce-endeavouros-port

      - name: Configure Arch and EndeavourOS package sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman-key --init
          pacman -Syu --noconfirm --needed ca-certificates curl git sudo wget
          install -d /etc/pacman.d
          printf '%s\n' 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          curl -fsSL https://raw.githubusercontent.com/endeavouros-team/EndeavourOS-ISO/0bbb1280ccd373262561453d85201f2707483990/pacman.conf -o /etc/pacman.conf
          curl -fsSL https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS/master/endeavouros-mirrorlist/endeavouros-mirrorlist -o /etc/pacman.d/endeavouros-mirrorlist
          pacman-key --populate archlinux
          pacman-key --recv-key 0F20FADC599D1C46EB556455AED8858E4B9813F1 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 0F20FADC599D1C46EB556455AED8858E4B9813F1
          pacman-key --recv-key 497AF50C92AD2384C56E1ACA003DB8B0CB23504F --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 497AF50C92AD2384C56E1ACA003DB8B0CB23504F
          pacman -Sy --noconfirm endeavouros-keyring endeavouros-mirrorlist
          pacman -Syu --noconfirm --needed base-devel sudo git wget curl timeshift btrfs-progs

      - name: Create package builder
        shell: bash
        run: |
          set -Eeuo pipefail
          useradd --create-home --groups wheel builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Fetch pinned EndeavourOS framework
        shell: bash
        run: |
          set -Eeuo pipefail
          su builder -c 'git clone https://github.com/endeavouros-team/EndeavourOS-ISO.git /tmp/EndeavourOS-ISO'
          su builder -c 'git -C /tmp/EndeavourOS-ISO checkout --detach 0bbb1280ccd373262561453d85201f2707483990'
          test "$(su builder -c 'git -C /tmp/EndeavourOS-ISO rev-parse HEAD')" = "0bbb1280ccd373262561453d85201f2707483990"
          su builder -c "ENDEAVOUROS_ISO_DIR=/tmp/EndeavourOS-ISO bash '$GITHUB_WORKSPACE/profiles/forja-xfce/prepare-forja.sh'"

      - name: Build Forja local packages only
        shell: bash
        run: |
          set -Eeuo pipefail
          su builder -c 'cd /tmp/EndeavourOS-ISO/forja-xfce-profile && ./prepare.sh'
          mapfile -t packages < <(find /tmp/EndeavourOS-ISO/forja-xfce-profile/airootfs/root/packages -maxdepth 1 -type f -name '*.pkg.tar.zst' -print)
          (( ${#packages[@]} == 7 )) || {
            echo "Esperados sete pacotes locais Forja; encontrados: ${#packages[@]}" >&2
            exit 1
          }
          for package in "${packages[@]}"; do pacman -Qp "$package"; done
          command -v grub-btrfsd
          test -s /usr/lib/systemd/system/grub-btrfsd.service
          bash "$GITHUB_WORKSPACE/profiles/forja-xfce/tests/test-snapshots-btrfs.sh"
          bash -n /tmp/EndeavourOS-ISO/forja-xfce-profile/run_before_squashfs.sh
          bash -n /tmp/EndeavourOS-ISO/forja-xfce-profile/run_before_squashfs-upstream.sh
          echo "Pré-build concluído. Nenhum mkarchiso foi executado."
