name: VENOM OS XFCE Arch ISO

on:
  workflow_dispatch:
  push:
    branches:
      - feature/venom-community-xfce
      - feature/venom-os-2.0-xfce
    paths:
      - '.github/workflows/**'
      - 'build/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: venom-arch-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install Arch build and test tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git archiso base-devel cmake meson ninja extra-cmake-modules gtk4 python python-yaml libpwquality parted shellcheck qemu-system-x86 edk2-ovmf grub syslinux

      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Pamac from Arch AUR and stage local repository
        run: |
          chmod +x scripts/build-pamac-aur.sh
          scripts/build-pamac-aur.sh
          install -d build/airootfs/usr/share/venom/aur-repo
          cp -a /tmp/venom-aur-repo/. build/airootfs/usr/share/venom/aur-repo/
          test -s build/airootfs/usr/share/venom/aur-repo/venom-aur.db
          test -s build/airootfs/usr/share/venom/aur-repo/venom-aur.files
          pacman --config build/pacman.conf -Sy --noconfirm
          pacman --config build/pacman.conf -Si libpamac-aur pamac-aur

      - name: Apply VENOM Calypso XFCE profile and stage Bibata cursor
        run: |
          chmod +x scripts/setup-xfce-windows-dark.sh
          scripts/setup-xfce-windows-dark.sh --root build/airootfs
          scripts/setup-xfce-windows-dark.sh --root build/install-overlay
          mkdir -p build/airootfs/usr/share/icons build/install-overlay/usr/share/icons
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/Bibata-Modern-Ice.tar.xz" https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz
          test "$(stat -c %s "$RUNNER_TEMP/Bibata-Modern-Ice.tar.xz")" -eq 1701468
          mkdir -p "$RUNNER_TEMP/bibata"
          tar -xJf "$RUNNER_TEMP/Bibata-Modern-Ice.tar.xz" -C "$RUNNER_TEMP/bibata"
          BIBATA_DIR="$(find "$RUNNER_TEMP/bibata" -type d -name Bibata-Modern-Ice -print -quit)"
          test -n "$BIBATA_DIR"
          cp -a "$BIBATA_DIR" build/airootfs/usr/share/icons/Bibata-Modern-Ice
          cp -a "$BIBATA_DIR" build/install-overlay/usr/share/icons/Bibata-Modern-Ice

      - name: Stage Yaru Blue icon theme
        run: |
          git clone --depth 1 https://github.com/ubuntu/yaru.git "$RUNNER_TEMP/yaru"
          mkdir -p "$RUNNER_TEMP/yaru-built" build/airootfs/usr/share/icons build/install-overlay/usr/share/icons
          for theme in Yaru Yaru-blue; do
            src="$RUNNER_TEMP/yaru/icons/$theme"
            dest="$RUNNER_TEMP/yaru-built/$theme"
            test -d "$src"
            cp -a "$src" "$dest"
            if [ "$theme" = "Yaru-blue" ]; then
              python3 "$RUNNER_TEMP/yaru/icons/src/generate-index-theme.py" "$theme" \
                --source-dir "$src" --output-dir "$dest" --output-name index.theme \
                --inherits Yaru
            else
              python3 "$RUNNER_TEMP/yaru/icons/src/generate-index-theme.py" "$theme" \
                --source-dir "$src" --output-dir "$dest" --output-name index.theme
            fi
            test -s "$dest/index.theme"
            cp -a "$dest" "build/airootfs/usr/share/icons/$theme"
            cp -a "$dest" "build/install-overlay/usr/share/icons/$theme"
          done


      - name: Mandatory VENOM preflight gate (no ISO build if rejected)
        run: python scripts/venom-preflight.py


      - name: Build and stage the simple VENOM installer
        run: |
          meson setup "$RUNNER_TEMP/venom-installer-build" installer --prefix=/usr --buildtype=release
          meson compile -C "$RUNNER_TEMP/venom-installer-build"
          DESTDIR="$GITHUB_WORKSPACE/build/airootfs" meson install -C "$RUNNER_TEMP/venom-installer-build"
          install -Dm755 installer/venom-install build/airootfs/usr/lib/venom/venom-install
          install -Dm644 installer/venom-installer.desktop build/airootfs/usr/share/applications/venom-installer.desktop
          install -Dm644 build/install-packages.x86_64 build/airootfs/usr/share/venom/install-packages.x86_64
          install -d build/airootfs/usr/share/venom/install-overlay
          cp -a build/install-overlay/. build/airootfs/usr/share/venom/install-overlay/
          test -x build/airootfs/usr/bin/venom-installer
          test -x build/airootfs/usr/lib/venom/venom-install

      - name: Validate Arch profile
        run: |
          chmod +x scripts/validate-xfce-profile.sh
          scripts/validate-xfce-profile.sh
          shellcheck -S error scripts/build-venom-iso.sh scripts/validate-xfce-profile.sh installer/venom-install build/profiledef.sh build/airootfs/root/.bash_profile build/airootfs/usr/local/lib/venom/venom-live-setup build/airootfs/usr/local/lib/venom/venom-live-ready

      - name: Build VENOM OS ISO with official Archiso
        run: |
          mkdir -p out work
          mkarchiso -v -w work -o out build
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          sha256sum "$ISO" | tee "$ISO.sha256"

      - name: Verify simple VENOM installer payload
        run: |
          test -x build/airootfs/usr/bin/venom-installer
          test -x build/airootfs/usr/lib/venom/venom-install
          test -f build/airootfs/usr/share/applications/venom-installer.desktop
          grep -Fq 'Exec=venom-installer' build/airootfs/usr/share/applications/venom-installer.desktop
          grep -Fq 'pacstrap -K -C /usr/share/venom/pacman-install.conf' installer/venom-install
          grep -Fq 'grub-install' installer/venom-install
          grep -Fq 'venom ALL=(root) NOPASSWD: /usr/lib/venom/venom-install' build/airootfs/usr/local/lib/venom/venom-live-setup
          grep -q 'VENOM_LIVE_READY' build/airootfs/usr/local/lib/venom/venom-live-ready

      - name: UEFI boot smoke test
        id: uefi
        run: |
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          OVMF_CODE="$(find /usr/share/edk2 -type f -iname 'OVMF_CODE*.fd' | head -n 1)"
          OVMF_VARS="$(find /usr/share/edk2 -type f -iname 'OVMF_VARS*.fd' | head -n 1)"
          test -n "$OVMF_CODE" && test -n "$OVMF_VARS"
          cp "$OVMF_VARS" /tmp/OVMF_VARS.fd
          set +e
          timeout 240s qemu-system-x86_64 -machine q35,accel=tcg -m 4096 -smp 2 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -cdrom "$ISO" -boot d -display none -serial file:uefi-serial.log -monitor none -no-reboot -no-shutdown
          QEMU_STATUS=$?
          set -e
          cat uefi-serial.log || true
          test "$QEMU_STATUS" -eq 124
          grep -Fq 'VENOM_AUTOMATED_SCRIPT_DISPATCHED' uefi-serial.log
          grep -Fq 'VENOM_LIVE_SETUP_STARTED' uefi-serial.log
          grep -Fq 'VENOM_LIVE_READY' uefi-serial.log

      - name: Upload boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venom-xfce-boot-diagnostics
          path: |
            uefi-serial.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ISO and validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: venom-os-xfce-arch-iso
          path: |
            out/*.iso
            out/*.sha256
            bios-serial.log
            uefi-serial.log
          if-no-files-found: error
          retention-days: 14
