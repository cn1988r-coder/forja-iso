name: Validate VENOM Arch XFCE profile

# Static checks only: no ISO generation.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/venom-community-xfce
    paths:
      - 'build/**'
      - 'installer/**'
      - 'scripts/validate-xfce-profile.sh'
      - 'scripts/setup-xfce-windows-dark.sh'
      - 'scripts/build-pamac-aur.sh'
      - 'scripts/venom-preflight.py'
      - '.github/workflows/build-arch-iso.yml'
      - '.github/workflows/validate-arch-xfce.yml'

permissions:
  contents: read

concurrency:
  group: venom-static-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install static validation tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git archiso python python-yaml shellcheck gcc meson ninja pkgconf glib2 json-glib ncurses

      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage the same VENOM XFCE profile used by the ISO build
        run: |
          chmod +x scripts/setup-xfce-windows-dark.sh
          scripts/setup-xfce-windows-dark.sh --root build/airootfs
          scripts/setup-xfce-windows-dark.sh --root build/install-overlay

      - name: Compilar TUI e executar testes do instalador
        run: |
          meson setup /tmp/venom-installer-build installer
          meson compile -C /tmp/venom-installer-build
          meson test -C /tmp/venom-installer-build --print-errorlogs

      - name: Run comprehensive VENOM preflight
        run: python scripts/venom-preflight.py


      - name: Validate profile and official package availability
        run: |
          chmod +x scripts/validate-xfce-profile.sh
          bash scripts/validate-xfce-profile.sh

      - name: Check shell syntax
        run: |
          bash -n scripts/build-venom-iso.sh
          bash -n scripts/setup-xfce-windows-dark.sh
          bash -n scripts/validate-xfce-profile.sh
          shellcheck -S error scripts/build-venom-iso.sh scripts/setup-xfce-windows-dark.sh scripts/build-pamac-aur.sh scripts/validate-xfce-profile.sh build/profiledef.sh build/airootfs/root/.bash_profile build/airootfs/usr/local/lib/venom/venom-live-setup build/airootfs/usr/local/lib/venom/venom-live-ready
