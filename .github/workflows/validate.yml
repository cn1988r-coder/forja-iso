name: Validar projeto

on:
  push:
    branches:
      - main
      - optimize/venom-iso-size
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar dependências GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config meson libgtk-4-dev
      - name: Compilar interface do instalador
        run: |
          meson setup installer/build installer
          meson compile -C installer/build
      - name: Validar escopo e configuração
        run: bash scripts/validate-scope.sh
