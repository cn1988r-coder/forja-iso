name: Validate Manjaro MATE sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manjaro-mate-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh build-manjaro.sh forja-pamac-pacman/install.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh forja-pamac-pacman/install.sh

      - name: Validate Forja Store backends and transactions
        shell: bash
        run: |
          set -euo pipefail
          bash -n forja-pamac-pacman/install.sh forja-pamac-pacman/src/forja-pkexec-sudo
          python3 -m py_compile \
            forja-pamac-pacman/src/forja-store \
            forja-pamac-pacman/src/forja-pacman-transaction \
            forja-pamac-pacman/src/forja-update-indicator
          python3 - <<'PY'
          import pathlib, runpy, sys, os
          from unittest.mock import patch
          root = pathlib.Path("forja-pamac-pacman")
          src = root / "src"
          ui = (src / "forja-store").read_text()
          indicator = (src / "forja-update-indicator").read_text()
          helper_text = (src / "forja-pacman-transaction").read_text()
          installer = (root / "install.sh").read_text()
          build = pathlib.Path("build-manjaro.sh").read_text()
          packages = (root / "packages.manjaro").read_text()

          for token in ('["pacman","-Ss",query]', '["yay","-Ssa",query]',
                        '["flatpak","search","--columns=application,name,description,remotes",query]',
                        '"repo":"Repositório oficial"', '"aur":"AUR"', '"flatpak":"Flatpak"'):
              assert token in ui, f"Pesquisa/origem ausente na loja: {token}"
          assert 'self.transact("remove" if installed else "install",source,name)' in ui
          assert '["pkexec",HELPER,action,source,name]' in ui
          assert '["yay","-Qua"]' in ui and '["flatpak","remote-ls","--system","--updates"' in ui
          assert '["flatpak","remote-ls","--user","--updates"' in ui
          assert '["flatpak","update","--user","--noninteractive","--assumeyes"]' in ui
          assert 'GLib.SOURCE_CONTINUE' not in ui or 'GLib.SOURCE_CONTINUE' in ui
          for token in ('["checkupdates"]', '["yay","-Qua"]',
                        '["flatpak","remote-ls","--system","--updates"',
                        '["flatpak","remote-ls","--user","--updates"',
                        'GLib.SOURCE_CONTINUE', 'GLib.timeout_add_seconds(1800,self.check)',
                        'GLib.timeout_add_seconds(60,self.check)'):
              assert token in indicator, f"Indicador sem suporte recorrente/fonte: {token}"
          assert 'self.checking=False' in indicator and 'self.upgrading=False' in indicator
          assert '["pkexec",HELPER,"upgrade"]' in indicator
          assert 'forja-pkexec-sudo' in installer and 'forja-flatpak-setup.service' in installer
          assert 'flatpak remote-add --if-not-exists --system flathub' in installer
          assert 'yay' in packages and 'base-devel' in packages and 'git' in packages
          assert 'yay' in build and 'base-devel' in build and 'forja-pamac-pacman/install.sh' in build
          assert pathlib.Path(root / "src/forja-pkexec-sudo").is_file()
          assert 'OnlyShowIn=MATE;' in (root / "forja-update-indicator.desktop").read_text()

          module = runpy.run_path(str(src / "forja-pacman-transaction"))
          main, call, shutil = module["main"], module["call"], module["shutil"]

          # Official repository install/remove, argument validation and cancellation/error propagation.
          with patch.object(module["subprocess"],"call",return_value=0) as proc:
              assert main(["install","repo","firefox"]) == 0
              proc.assert_called_once_with(["pacman","-S","--needed","--noconfirm","firefox"],timeout=7200)
          with patch.object(module["subprocess"],"call",return_value=0) as proc:
              assert main(["remove","repo","firefox"]) == 0
              proc.assert_called_once_with(["pacman","-Rns","--noconfirm","firefox"],timeout=7200)
          with patch.object(module["subprocess"],"call") as proc:
              assert main(["install","repo","-R"]) == 2
              proc.assert_not_called()
          with patch.object(module["subprocess"],"call",return_value=126):
              assert main(["install","repo","firefox"]) == 126, "Cancelamento/autorização negada deve ser propagado"

          # Flatpak system install configures Flathub first; uninstall is scoped and explicit.
          with patch.object(shutil,"which",return_value="/usr/bin/flatpak"), patch.object(module["subprocess"],"call",side_effect=[0,0]) as proc:
              assert main(["install","flatpak","org.mozilla.firefox"]) == 0
              assert proc.call_args_list[0].args[0][:4] == ["flatpak","remote-add","--if-not-exists","--system"]
              assert proc.call_args_list[1].args[0] == ["flatpak","install","--system","--noninteractive","--assumeyes","flathub","org.mozilla.firefox"]
          with patch.object(shutil,"which",return_value="/usr/bin/flatpak"), patch.object(module["subprocess"],"call",side_effect=[0,0]) as proc:
              assert main(["remove","flatpak","org.mozilla.firefox"]) == 0
              assert proc.call_args_list[0].args[0] == ["flatpak","info","--system","org.mozilla.firefox"]
              assert proc.call_args_list[1].args[0] == ["flatpak","uninstall","--system","--noninteractive","--assumeyes","--delete-data","org.mozilla.firefox"]
          with patch.object(shutil,"which",return_value="/usr/bin/flatpak"), patch.object(module["subprocess"],"call",return_value=1) as proc:
              assert main(["install","flatpak","org.mozilla.firefox"]) == 1
              proc.assert_called_once()

          # AUR helper runs as the invoking desktop user, never as root.
          with patch.object(shutil,"which",return_value="/usr/bin/yay"), \
               patch.dict(os.environ,{"PKEXEC_UID":"1000"}), \
               patch.object(module["pwd"],"getpwuid",return_value=type("U",(),{"pw_uid":1000,"pw_name":"tester","pw_dir":"/home/tester"})()), \
               patch.object(module["subprocess"],"call",return_value=0) as proc:
              assert main(["install","aur","google-chrome"]) == 0
              cmd=proc.call_args.args[0]
              assert cmd[:4] == ["runuser","-u","tester","--"]
              assert cmd[-4:] == ["-S","--needed","--noconfirm","google-chrome"]
              assert "--sudo" in cmd and "/usr/lib/forja/forja-pkexec-sudo" in cmd
          with patch.object(shutil,"which",return_value=None):
              assert main(["install","aur","some-package"]) == 127
          with patch.object(shutil,"which",return_value="/usr/bin/yay"), \
               patch.dict(os.environ,{"PKEXEC_UID":"1000"}), \
               patch.object(module["pwd"],"getpwuid",return_value=type("U",(),{"pw_uid":1000,"pw_name":"tester","pw_dir":"/home/tester"})()), \
               patch.object(module["subprocess"],"call",side_effect=[0,0,0]) as proc:
              assert main(["upgrade"]) == 0
              assert proc.call_args_list[0].args[0] == ["pacman","-Syu","--noconfirm"]
              assert "yay" in proc.call_args_list[1].args[0]
              assert proc.call_args_list[2].args[0] == ["flatpak","update","--system","--noninteractive","--assumeyes"]
          print("Forja Store: Pacman, AUR/yay, Flatpak, transações, cancelamento e erros validados.")
          PY

      - name: Verify Manjaro MATE-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DESKTOP=mate' build-manjaro.sh
          grep -Fq 'DESKTOP_CORE_PACKAGES=(mate-session-manager' build-manjaro.sh
          grep -Fq 'DM=lightdm' build-manjaro.sh
          grep -Fq 'user-session=mate' build-manjaro.sh
          ! grep -Eiq 'xfce|gnome|plasma|kde' build-manjaro.sh
          grep -Fq 'gh release create' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'COMPRESSION=xz' build-manjaro.sh
          grep -Fq 'SQFS_WRAPPER_DIR=' build-manjaro.sh
          grep -Fq -- '-b 1M -Xdict-size 1M' build-manjaro.sh
          grep -Fq 'buildiso -f' build-manjaro.sh
          grep -Fq 'forja-mate-wallpaper.svg' build-manjaro.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("build-manjaro.sh").read_text()
          config = re.search(r"cat > \"\$overlay/etc/fastfetch/config.jsonc\" <<'FASTFETCH'\n(.*?)\nFASTFETCH", source, re.S)
          logo = re.search(r"cat > \"\$overlay/usr/share/fastfetch/forja-logo.txt\" <<'LOGO'\n(.*?)\nLOGO", source, re.S)
          assert config and logo, "Configuração ou texto do Fastfetch não foi encontrado"
          assert '"source": "/usr/share/fastfetch/forja-logo.txt"' in config.group(1)
          assert '"os"' not in config.group(1), "Fastfetch não deve exibir o nome da base técnica"
          assert logo.group(1).strip() == "FORJA OS", "O cabeçalho deve conter somente FORJA OS, sem ícone ou arte ASCII"
          PY
          grep -Fq 'sha256sum --check' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DISTRIBUTION=manjaro' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DESKTOP=mate' .github/workflows/build-manjaro-mate.yml
          ! grep -Eiq 'shelly' build-manjaro.sh .github/workflows/build-manjaro-mate.yml
          grep -Fq 'materia-gtk-theme' build-manjaro.sh
          grep -Fq 'papirus-icon-theme' build-manjaro.sh
          grep -Fq 'bibata-cursor-theme' build-manjaro.sh
          grep -Fq "icon-theme='Papirus-Dark'" build-manjaro.sh
          grep -Fq "gtk-theme='Materia-dark'" build-manjaro.sh
          grep -Fq "cursor-theme='Bibata-Modern-Ice'" build-manjaro.sh
          grep -Fq 'Inherits=Bibata-Modern-Ice' build-manjaro.sh
          grep -Fq "picture-filename='/usr/share/backgrounds/forja-os-mate.svg'" build-manjaro.sh
          grep -Fq 'theme-name=Materia-dark' build-manjaro.sh
          grep -Fq 'font-name=Noto Sans 10' build-manjaro.sh
          grep -Fq "monospace-font-name='JetBrains Mono 11'" build-manjaro.sh
          for package in vlc htop gparted noto-fonts ttf-jetbrains-mono; do
            grep -Fq "$package" build-manjaro.sh
          done
          for package in mate-terminal mate-calc mate-utils mate-system-monitor mate-applets pluma engrampa atril eom mozo; do
            grep -Fq "$package" build-manjaro.sh
          done
          grep -Fq 'forja-pamac-pacman/install.sh' build-manjaro.sh
          grep -Fq 'flatpak' build-manjaro.sh
          ! grep -Eq 'gtk4|libayatana-appindicator' build-manjaro.sh forja-pamac-pacman/packages.manjaro
          grep -Fq 'Forja Store' forja-pamac-pacman/src/forja-store
          grep -Fq 'Name=Forja Store' forja-pamac-pacman/forja-software.desktop
          ! grep -Eiq 'pamac' forja-pamac-pacman/src/forja-store forja-pamac-pacman/install.sh
          for package in networkmanager network-manager-applet bluez bluez-utils blueman firefox calamares; do
            grep -Fq "$package" build-manjaro.sh
          done
          echo "Configuração Forja OS MATE + wallpaper + Materia Dark + Papirus-Dark + Bibata validada."
      - name: Preflight Manjaro MATE without creating ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            manjarolinux/base:latest bash -lc 'bash /forja-ci/build-manjaro.sh'
