name: Validate Manjaro MATE sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manjaro-mate-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh build-manjaro.sh forja-pamac-pacman/install.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh forja-pamac-pacman/install.sh

      - name: Validate Forja Pacman software manager
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            forja-pamac-pacman/src/forja-store \
            forja-pamac-pacman/src/forja-pacman-transaction \
            forja-pamac-pacman/src/forja-update-indicator
          python3 - <<'PY'
          import runpy
          import pathlib
          import sys
          from unittest.mock import patch

          root = pathlib.Path("forja-pamac-pacman/src")
          ui = (root / "forja-store").read_text()
          assert '"atualizar":"upgrade"' in ui, "Botão Atualizar não está ligado a upgrade"
          assert '"remover":"remove"' in ui, "Botão Remover não está ligado a remove"
          assert 'pacman' in ui.lower(), "A loja não está integrada ao Pacman"
          assert 'forja-pamac-pacman/install.sh' in pathlib.Path("build-manjaro.sh").read_text(), "Pamac/Forja Software não está instalado na imagem"

          module = runpy.run_path(str(root / "forja-pacman-transaction"))
          main = module["main"]
          subprocess = module["subprocess"]

          with patch.object(sys, "argv", ["helper", "upgrade", "firefox"]), patch.object(subprocess, "call", return_value=0) as call:
              assert main() == 0
              call.assert_called_once_with(["pacman", "-S", "--needed", "firefox"])

          shutil = module["shutil"]
          with patch.object(sys, "argv", ["helper", "upgrade"]), patch.object(shutil, "which", return_value=None), patch.object(subprocess, "call", return_value=0) as call:
              assert main() == 0
              call.assert_called_once_with(["pacman", "-Syu"])

          with patch.object(sys, "argv", ["helper", "upgrade"]), patch.object(shutil, "which", return_value="/usr/bin/flatpak"), patch.object(subprocess, "call", side_effect=[0, 0]) as call:
              assert main() == 0
              assert call.call_args_list[0].args[0] == ["pacman", "-Syu"]
              assert call.call_args_list[1].args[0] == ["flatpak", "update", "--system", "--noninteractive", "--assumeyes"]

          with patch.object(sys, "argv", ["helper", "flatpak-upgrade"]), patch.object(shutil, "which", return_value="/usr/bin/flatpak"), patch.object(subprocess, "call", return_value=0) as call:
              assert main() == 0
              call.assert_called_once_with(["flatpak", "update", "--system", "--noninteractive", "--assumeyes"])

          with patch.object(sys, "argv", ["helper", "install", "-R"]), patch.object(subprocess, "call") as call:
              assert main() == 2, "Nome iniciado por hífen deveria ser rejeitado"
              call.assert_not_called()
          print("Forja Software: sintaxe, atualização direcionada e validação de argumentos OK.")
          PY

      - name: Verify Manjaro MATE-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DESKTOP=mate' build-manjaro.sh
          grep -Fq 'DESKTOP_CORE_PACKAGES=(mate-session-manager' build-manjaro.sh
          grep -Fq 'DM=lightdm' build-manjaro.sh
          grep -Fq 'user-session=mate' build-manjaro.sh
          ! grep -Eiq 'xfce|gnome|plasma|kde' build-manjaro.sh
          grep -Fq 'gh release create' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'COMPRESSION=xz' build-manjaro.sh
          grep -Fq 'SQFS_WRAPPER_DIR=' build-manjaro.sh
          grep -Fq -- '-b 1M -Xdict-size 1M' build-manjaro.sh
          ! grep -Fq 'buildiso -f' build-manjaro.sh
          ! grep -Fq 'forja-mate-wallpaper.svg' build-manjaro.sh
          grep -Fq 'sha256sum --check' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DISTRIBUTION=manjaro' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DESKTOP=mate' .github/workflows/build-manjaro-mate.yml
          ! grep -Eiq 'shelly' build-manjaro.sh .github/workflows/build-manjaro-mate.yml
          grep -Fq 'scour' build-manjaro.sh
          grep -Fq 'biglinux-icons-material.git' build-manjaro.sh
          grep -Fq 'BigLinux-Icons-Material-Dark' build-manjaro.sh
          grep -Fq 'icon-theme=BigLinux-Icons-Material-Dark' build-manjaro.sh
          grep -Fq 'Inherits=hicolor' build-manjaro.sh
          ! grep -Fq 'papirus-icon-theme' build-manjaro.sh
          ! grep -Fq 'Papirus-Dark' build-manjaro.sh
          grep -Fq 'forja-pamac-pacman/install.sh' build-manjaro.sh
          for package in networkmanager network-manager-applet bluez bluez-utils blueman firefox calamares; do
            grep -Fq "$package" build-manjaro.sh
          done
          ! grep -Eiq 'flatpak|cups|system-config-printer|mate-applets|mate-calc|engrampa|atril|pluma' build-manjaro.sh
          echo "Configuração Manjaro MATE + Forja Software validada."

      - name: Preflight Manjaro MATE without creating ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            manjarolinux/base:latest bash -lc 'bash /forja-ci/build-manjaro.sh'
