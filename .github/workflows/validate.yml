name: Validar projeto

on:
  push:
    branches:
      - main
      - optimize/venom-iso-size
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar dentro do ambiente Arch Linux
        run: bash scripts/build-container.sh
