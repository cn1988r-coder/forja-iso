name: Validate Forja OS Manjaro MATE

on:
  workflow_dispatch:
  push:
    branches:
      - feature/forja-manjaro-mate

permissions:
  contents: read

concurrency:
  group: forja-mate-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Forja MATE profile and build scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Forja OS MATE source
        uses: actions/checkout@v4
        with:
          ref: feature/forja-manjaro-mate

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils libxml2-utils

      - name: Validate source and packaging configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          bash desktops/mate/tests/validate-profile.sh
          bash -n build-manjaro.sh
          bash -n build-cloud.sh
          shellcheck -S warning -e SC1091 build-manjaro.sh build-cloud.sh
          desktop-file-validate desktops/mate/panel-launchers/*.desktop
          python3 -c 'import json, xml.etree.ElementTree as ET; json.load(open("desktops/mate/fastfetch/config.jsonc")); ET.parse("desktops/mate/panel-launchers/forja-menu.svg")'
          xmllint --noout desktops/mate/panel/forja.layout
          grep -Fq 'ref: feature/forja-manjaro-mate' .github/workflows/build-forja-iso.yml
          grep -Fq 'retention-days: 1' .github/workflows/build-forja-iso.yml
