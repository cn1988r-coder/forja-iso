name: Validate Manjaro MATE sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: manjaro-mate-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax and ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh build-manjaro.sh build-shelly.sh
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 build-cloud.sh build-manjaro.sh build-shelly.sh

      - name: Validate Forja Pacman software manager
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            forja-pamac-pacman/src/forja-store \
            forja-pamac-pacman/src/forja-pacman-transaction \
            forja-pamac-pacman/src/forja-update-indicator
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import sys
          from unittest.mock import patch

          root = pathlib.Path("forja-pamac-pacman/src")
          ui = (root / "forja-store").read_text()
          assert '"atualizar":"upgrade"' in ui, "Botão Atualizar não está ligado a upgrade"
          assert '"remover":"remove"' in ui, "Botão Remover não está ligado a remove"

          spec = importlib.util.spec_from_file_location("forja_transaction", root / "forja-pacman-transaction")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          with patch.object(sys, "argv", ["helper", "upgrade", "firefox"]), patch.object(module.subprocess, "call", return_value=0) as call:
              assert module.main() == 0
              call.assert_called_once_with(["pacman", "-S", "--needed", "firefox"])

          with patch.object(sys, "argv", ["helper", "install", "-R"]), patch.object(subprocess, "call") as call:
              assert module.main() == 2, "Nome iniciado por hífen deveria ser rejeitado"
              call.assert_not_called()
          print("Forja Software: sintaxe, atualização direcionada e validação de argumentos OK.")
          PY

      - name: Verify Manjaro MATE-only configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DESKTOP=mate' build-manjaro.sh
          grep -Fq 'DESKTOP_CORE_PACKAGES=(mate-session-manager' build-manjaro.sh
          grep -Fq 'DM=lightdm' build-manjaro.sh
          grep -Fq 'user-session=mate' build-manjaro.sh
          ! grep -Eiq 'xfce|gnome|plasma|kde' build-manjaro.sh
          grep -Fq 'retention-days: 1' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DISTRIBUTION=manjaro' .github/workflows/build-manjaro-mate.yml
          grep -Fq 'FORJA_DESKTOP=mate' .github/workflows/build-manjaro-mate.yml
          echo "Configuração Manjaro MATE-only validada."

      - name: Verify Shelly source checksums
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/eu-project-iso-main/ci/shelly:/source:ro" \
            archlinux:latest bash -lc '
              pacman -Syu --noconfirm --needed base-devel git
              useradd --create-home builder
              cp -a /source /tmp/shelly-source
              chown -R builder:builder /tmp/shelly-source
              su -s /bin/bash builder -c "cd /tmp/shelly-source && makepkg --verifysource --noconfirm"
            '

      - name: Preflight Manjaro MATE without creating ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            manjarolinux/base:latest bash -lc 'bash /forja-ci/build-manjaro.sh'
