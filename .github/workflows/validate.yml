name: Validate Forja Store and desktop integration

on:
  push:
    branches: [main, feature/forja-xfce-store-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forja-store-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils libxml2-utils

      - name: Validate shell syntax, Python sources and parsers
        shell: bash
        run: |
          set -euo pipefail
          bash -n forja-pamac-pacman/install.sh
          bash -n forja-pamac-pacman/build-pamac.sh
          bash -n forja-pamac-pacman/src/forja-pkexec-sudo
          shellcheck -S warning -e SC1091 forja-pamac-pacman/install.sh forja-pamac-pacman/build-pamac.sh forja-pamac-pacman/src/forja-pkexec-sudo
          python3 -m py_compile \
            forja-pamac-pacman/src/forja_store_core.py \
            forja-pamac-pacman/src/forja-pacman-transaction \
            forja-pamac-pacman/src/forja-update-indicator
          python3 -m unittest discover -s forja-pamac-pacman/tests -v

      - name: Validate XFCE appearance, desktop entries and icons
        shell: bash
        run: |
          set -euo pipefail
          bash -x desktops/xfce/tests/validate-appearance.sh
          desktop-file-validate \
            desktops/xfce/forja-xfce-appearance.desktop \
            forja-pamac-pacman/forja-software.desktop \
            forja-pamac-pacman/forja-update-indicator.desktop \
            && python3 -c 'import sys, xml.etree.ElementTree as ET; [ET.parse(p) for p in sys.argv[1:]]' \
            desktops/xfce/forja-flame.svg \
            desktops/xfce/forja-black-wallpaper.svg \
            desktops/xfce/forja-xfce-desktop.xml \
            desktops/xfce/panel-default.xml \
            forja-pamac-pacman/icons/forja-store.svg \
            forja-pamac-pacman/icons/forja-update-current.svg \
            forja-pamac-pacman/icons/forja-update-available.svg \
            forja-pamac-pacman/icons/forja-update-error.svg

      - name: Validate Forja Store and XFCE wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("forja-pamac-pacman")
          css = (root / "patches/forja-store.css").read_text()
          build_store = (root / "build-pamac.sh").read_text()
          installer = (root / "install.sh").read_text()
          launcher = (root / "bin/forja-store").read_text()
          transaction = (root / "src/forja-pacman-transaction").read_text()
          indicator = (root / "src/forja-update-indicator").read_text()
          core = (root / "src/forja_store_core.py").read_text()
          packages = Path("desktops/xfce/packages.manjaro").read_text()
          build = Path("build-manjaro.sh").read_text()

          assert 'UPSTREAM_COMMIT="363e794fef4f9f6a0e54757fd12155cf27e02cc3"' in build_store
          assert 'meson compile -C "$BUILD" pamac-manager' in build_store
          assert 'about.application_name = "Forja Store"' in build_store
          assert '@define-color forja_bg #111111' in css
          assert 'boxed-list > row' in css and 'button.suggested-action' in css
          assert 'FORJA_PAMAC_BUILD_DIR' in installer
          assert 'pamac-11.7.5-forja-source.tar.gz' in installer
          assert 'LD_LIBRARY_PATH="/usr/lib/forja' in launcher
          assert 'pamac' in transaction and 'flatpak' in transaction
          assert 'parse_flatpak_updates' in indicator and 'parse_checkupdates' in core
          assert 'gtk4' in packages and 'libadwaita' in packages
          assert 'pamac-gtk' in packages and 'libpamac-flatpak-plugin' in packages
          assert 'build-pamac.sh' in build
          assert 'OnlyShowIn=XFCE;' in (root / "forja-update-indicator.desktop").read_text()
          assert 'polkit-gnome' in packages
          print("Forja Store: Pamac GTK4/libadwaita, libpamac, AUR, Flatpak, visual Forja e XFCE verificados.")
          PY

      - name: Build AppStream integration validation container
        run: docker build -f desktops/xfce/Dockerfile .
