name: Validate Forja sources

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: forja-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n build-cloud.sh build-arch.sh build-manjaro.sh build-shelly.sh
          bash -n eu-project-iso-main/ci/build-cloud.sh
          bash -n eu-project-iso-main/ci/build-arch.sh
          bash -n eu-project-iso-main/ci/build-manjaro.sh
          bash -n eu-project-iso-main/ci/build-shelly.sh

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 \
            build-cloud.sh build-arch.sh build-manjaro.sh build-shelly.sh \
            eu-project-iso-main/ci/build-cloud.sh \
            eu-project-iso-main/ci/build-arch.sh \
            eu-project-iso-main/ci/build-manjaro.sh \
            eu-project-iso-main/ci/build-shelly.sh

      - name: Validate embedded Python blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path("build-arch.sh"),
              Path("build-manjaro.sh"),
              Path("build-shelly.sh"),
              Path("eu-project-iso-main/ci/build-arch.sh"),
              Path("eu-project-iso-main/ci/build-manjaro.sh"),
              Path("eu-project-iso-main/ci/build-shelly.sh"),
          ]
          count = 0
          for path in paths:
              source = path.read_text(encoding="utf-8")
              blocks = re.findall(r"<<'PY'\s*\n(.*?)^PY$", source, re.S | re.M)
              for index, block in enumerate(blocks, 1):
                  compile(block, f"{path}:python-block-{index}", "exec")
                  count += 1
          if count == 0:
              raise SystemExit("Nenhum bloco Python embutido foi validado.")
          print(f"{count} blocos Python embutidos validados.")
          PY

      - name: Verify Shelly and Bibata source checksums
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE/eu-project-iso-main/ci/shelly:/source:ro" \
            archlinux:latest bash -lc '
              pacman -Syu --noconfirm --needed base-devel git
              useradd --create-home builder
              cp -a /source /tmp/shelly-source
              chown -R builder:builder /tmp/shelly-source
              su -s /bin/bash builder -c "cd /tmp/shelly-source && makepkg --verifysource --noconfirm"
              git clone --depth 1 https://aur.archlinux.org/bibata-cursor-theme.git /tmp/bibata-source
              chown -R builder:builder /tmp/bibata-source
              su -s /bin/bash builder -c "cd /tmp/bibata-source && makepkg --verifysource --noconfirm"
            '

      - name: Preflight Arch build without creating ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            archlinux:latest bash -lc 'bash /forja-ci/build-arch.sh'

      - name: Preflight Manjaro build without creating ISO
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -e FORJA_DESKTOP=mate \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            manjarolinux/base:latest bash -lc 'bash /forja-ci/build-manjaro.sh'

      - name: Inspect Manjaro stable ISO profiles
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch v17.1 https://code.manjaro.org/profiles/iso-profiles.git /tmp/manjaro-iso-profiles
          for desktop in xfce gnome kde; do
            test -f "/tmp/manjaro-iso-profiles/manjaro/$desktop/profile.conf"
            test -f "/tmp/manjaro-iso-profiles/manjaro/$desktop/Packages-Desktop"
          done
          grep -Fxq 'displaymanager="sddm"' /tmp/manjaro-iso-profiles/manjaro/kde/profile.conf
          grep -Eq '^[[:space:]]*sddm([[:space:]]|$)' /tmp/manjaro-iso-profiles/manjaro/kde/Packages-Desktop
          grep -Fq 'kde) DESKTOP_CORE_PACKAGES=(sddm plasma-desktop plasma-workspace kwin)' build-manjaro.sh
          grep -Fq 'kde) DM=sddm ;;' build-manjaro.sh
          grep -Fxq 'displaymanager="lightdm"' /tmp/manjaro-iso-profiles/manjaro/xfce/profile.conf
          grep -Fxq 'lightdm' /tmp/manjaro-iso-profiles/manjaro/xfce/Packages-Desktop
          grep -Fxq 'lightdm-gtk-greeter' /tmp/manjaro-iso-profiles/manjaro/xfce/Packages-Desktop
          grep -Fxq 'displaymanager="gdm"' /tmp/manjaro-iso-profiles/manjaro/gnome/profile.conf
          grep -Fxq 'gdm' /tmp/manjaro-iso-profiles/manjaro/gnome/Packages-Desktop
          grep -Fxq 'sddm' /tmp/manjaro-iso-profiles/manjaro/kde/Packages-Desktop
          for package in plasma-desktop plasma-workspace kwin; do
            grep -Fxq "$package" /tmp/manjaro-iso-profiles/manjaro/kde/Packages-Desktop
          done
          grep -Fq "'clickgen>=2.1.8'" build-shelly.sh
          echo "Manjaro v17.1 KDE: SDDM confirmado no perfil e no construtor."

      - name: Validate Python syntax
        run: python3 -m py_compile eu-project-iso-main/forja_agent.py

      - name: Validate supported build choices
        shell: bash
        run: |
          set -euo pipefail
          for desktop in xfce mate gnome kde; do
            grep -Fq "$desktop" .github/workflows/build-iso.yml
          done
          for kernel in lts latest; do
            grep -Fq "$kernel" .github/workflows/build-iso.yml
          done
          grep -Fq 'FORJA_DISTRIBUTION: ${{ inputs.distribution }}' .github/workflows/build-iso.yml
          grep -Fq 'bash /forja-ci/build-cloud.sh' .github/workflows/build-iso.yml
          grep -Fq -- '--branch v17.1' build-manjaro.sh
          grep -Fq '["pacman", "-Sl"]' build-manjaro.sh
          grep -Fq 'available = {}' build-manjaro.sh
          grep -Fq 'Ignore release candidates' build-manjaro.sh
          grep -Fq 'kind == "latest"' build-manjaro.sh
          grep -Fq 'FORJA_PREFLIGHT_ONLY' build-arch.sh
          grep -Fq 'FORJA_PREFLIGHT_ONLY' build-manjaro.sh
          grep -Fq 'firefox' build-manjaro.sh
          grep -Fq 'x-scheme-handler/https=firefox.desktop' build-manjaro.sh
          grep -Fq 'shelly-flatpak-backend' build-manjaro.sh
          grep -Fq 'moniker' build-manjaro.sh
