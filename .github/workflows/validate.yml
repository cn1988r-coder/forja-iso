name: Validate Forja Store and desktop integration

on:
  push:
    branches: [main, feature/forja-xfce-store-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forja-store-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck desktop-file-utils libxml2-utils

      - name: Validate shell syntax, Python sources and parsers
        shell: bash
        run: |
          set -euo pipefail
          bash -n forja-pamac-pacman/install.sh
          bash -n forja-pamac-pacman/src/forja-pkexec-sudo
          shellcheck -S warning -e SC1091 forja-pamac-pacman/install.sh forja-pamac-pacman/src/forja-pkexec-sudo
          python3 -m py_compile \
            forja-pamac-pacman/src/forja-store \
            forja-pamac-pacman/src/forja_store_core.py \
            forja-pamac-pacman/src/forja-pacman-transaction \
            forja-pamac-pacman/src/forja-update-indicator
          python3 -m unittest discover -s forja-pamac-pacman/tests -v

      - name: Validate XFCE appearance, desktop entries and icons
        shell: bash
        run: |
          set -euo pipefail
          bash -x desktops/xfce/tests/validate-appearance.sh
          desktop-file-validate \
            desktops/xfce/forja-xfce-appearance.desktop \
            forja-pamac-pacman/forja-software.desktop \
            forja-pamac-pacman/forja-update-indicator.desktop \
            forja-pamac-pacman/forja-polkit-agent.desktop
          xmllint --noout \
            desktops/xfce/forja-flame.svg \
            desktops/xfce/forja-black-wallpaper.svg \
            desktops/xfce/forja-xfce-desktop.xml \
            desktops/xfce/panel-default.xml \
            forja-pamac-pacman/icons/forja-update-current.svg \
            forja-pamac-pacman/icons/forja-update-available.svg \
            forja-pamac-pacman/icons/forja-update-error.svg

      - name: Validate Forja Store and XFCE wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("forja-pamac-pacman")
          ui = (root / "src/forja-store").read_text()
          core = (root / "src/forja_store_core.py").read_text()
          transaction = (root / "src/forja-pacman-transaction").read_text()
          indicator = (root / "src/forja-update-indicator").read_text()
          installer = (root / "install.sh").read_text()
          packages = (root / "packages.manjaro").read_text()
          xfce_packages = Path("desktops/xfce/packages.manjaro").read_text()
          build = Path("build-manjaro.sh").read_text()

          css = re.search(r'CSS = """(.*?)"""', ui, re.S)
          assert css, "CSS da Forja Store ausente"
          for color in re.findall(r"#[0-9a-fA-F]{6}", css.group(1)):
              rgb = tuple(int(color[i:i+2], 16) for i in (1, 3, 5))
              assert max(rgb) - min(rgb) <= 2, f"Cor fora da escala neutra: {color}"

          assert "from forja_store_core import" in ui
          assert "def load_catalog(self, title, category)" in ui
          assert "appstreamcli" in ui and "list-categories" in ui and "ALL_APPSTREAM_CATEGORIES" in ui
          assert "pamac" in ui and "flatpak" in ui
          assert "parse_flatpak_search" in core and "parse_appstream" in core
          assert "parse_flatpak_updates" in indicator and "parse_checkupdates" in indicator
          assert 'new_from_icon_name("forja-update-current")' in indicator
          for state in ("forja-update-current", "forja-update-available", "forja-update-error"):
              assert state in indicator, f"Indicador sem estado: {state}"
          assert '"pamac", "upgrade", "--aur", "--no-confirm"' in transaction and '"pamac", "build", "--no-confirm"' in transaction
          assert "flatpak remote-ls" in ui and "remote" in ui
          assert "forja_store_core.py" in installer and "forja-polkit-agent.desktop" in installer
          assert "appstream" in packages and "archlinux-appstream-data" in packages
          assert "polkit-gnome" in xfce_packages
          assert "OnlyShowIn=XFCE;" in (root / "forja-polkit-agent.desktop").read_text()
          assert "OnlyShowIn=XFCE;" in (root / "forja-update-indicator.desktop").read_text()
          assert 'DESKTOP="${FORJA_DESKTOP:-xfce}"' in build
          assert 'case "$DESKTOP" in xfce)' in build
          assert "forja-pamac-pacman/install.sh" in build
          assert "mate-session-manager" not in xfce_packages and "mate-panel" not in xfce_packages
          print("Forja Store: AppStream, Pamac, AUR, Flatpak, Polkit e XFCE verificados.")
          PY

      - name: Build AppStream integration validation container
        run: docker build -f desktops/xfce/Dockerfile .
