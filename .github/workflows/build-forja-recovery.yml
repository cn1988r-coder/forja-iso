name: Build Forja Recovery package

on:
  push:
    branches:
      - feature/forja-xfce-endeavouros-port
    paths:
      - 'profiles/forja-xfce/forja-packages/forja-recovery/**'
      - '.github/workflows/build-forja-recovery.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm git python python-gobject gtk3 btrfs-progs snapper pacman grub sudo
      - uses: actions/checkout@v4
      - name: Build package as unprivileged user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc "cd '$GITHUB_WORKSPACE/profiles/forja-xfce/forja-packages/forja-recovery' && makepkg --cleanbuild --syncdeps --noconfirm"
      - name: Verify package archive
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(profiles/forja-xfce/forja-packages/forja-recovery/forja-recovery-*.pkg.tar.zst)
          test "${#packages[@]}" -eq 1
          pacman -Qip "${packages[0]}"
          tar -tf "${packages[0]}" | grep -E 'usr/bin/forja-recovery(-cli)?$'
      - name: Upload temporary package artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-recovery-package-${{ github.run_number }}
          path: profiles/forja-xfce/forja-packages/forja-recovery/forja-recovery-*.pkg.tar.zst
          retention-days: 1
