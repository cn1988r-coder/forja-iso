name: Validar perfil Forja OS

on:
  push:
    branches:
      - fix/forja-calamares-stability
    paths:
      - "scripts/**"
      - "build/**"
      - ".github/workflows/validate-forja.yml"

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar scripts e perfil da distribuição
        run: bash scripts/validate-build.sh

  patcher-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Testar patcher contra o Calamares upstream fixado
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/endeavouros-team/calamares.git "$RUNNER_TEMP/calamares"
          git -C "$RUNNER_TEMP/calamares" checkout --detach c1aedc8f3abbaa4ecc94a819623884f41b22f087
          mkdir -p "$RUNNER_TEMP/branding"
          cp -a build/calamares/branding/forja "$RUNNER_TEMP/branding/forja"
          cp build/packages.arch "$RUNNER_TEMP/branding/packages.arch"
          cp build/packages.mate "$RUNNER_TEMP/branding/packages.mate"
          cp scripts/patch-calamares.py "$RUNNER_TEMP/patch-calamares.py"
          python "$RUNNER_TEMP/patch-calamares.py" "$RUNNER_TEMP/calamares"

          EOS="$RUNNER_TEMP/calamares/data/eos"
          grep -Fxq 'branding: forja' "$EOS/settings_online.conf"
          grep -Fxq 'branding: forja' "$EOS/settings_offline.conf"
          grep -Fq 'welcome@forja_welcome' "$EOS/settings_online.conf"
          grep -Fq '  - packages@online' "$EOS/settings_online.conf"
          ! grep -Fq '  - unpackfs' "$EOS/settings_online.conf"
          grep -Fq '  - unpackfs' "$EOS/settings_offline.conf"
          ! grep -Fq 'packages@online' "$EOS/settings_offline.conf"

          grep -Fq '    - internet' "$EOS/modules/welcome_forja_online.conf"
          grep -Fq 'backend: pacman' "$EOS/modules/packages_online.conf"
          grep -Fq 'update_db: true' "$EOS/modules/packages_online.conf"
          grep -Fq 'networkmanager' "$EOS/modules/packages_online.conf"
          grep -Fq 'mate-session-manager' "$EOS/modules/packages_online.conf"
          ! grep -Eq 'endeavouros|eos-' "$EOS/modules/packages_online.conf"

          grep -Fq '/usr/share/forja/packages/shelly-git-*.pkg.tar.zst' "$EOS/modules/shellprocess_forja_stage_packages.conf"
          grep -Fq 'pacman -U --noconfirm --needed /tmp/forja-packages/*.pkg.tar.zst' "$EOS/modules/shellprocess_forja_local_packages.conf"
          grep -Fq 'packages=$(pacman -Qq | grep -E' "$EOS/modules/shellprocess_forja_cleanup.conf"

          grep -Fxq 'efiBootLoader: "grub"' "$EOS/modules/bootloader.conf"
          ! grep -q 'efiBootLoaderVar:' "$EOS/modules/partition.conf"
          grep -Fq 'availableFileSystemTypes:  ["ext4"]' "$EOS/modules/partition.conf"
          grep -Fq '/run/archiso/bootmnt/arch/x86_64/airootfs.sfs' "$EOS/modules/unpackfs.conf"
          grep -Fxq 'username: liveuser' "$EOS/modules/removeuser.conf"
          grep -Fq 'displaymanagers:' "$EOS/modules/displaymanager.conf"
          grep -Fq 'lightdm.service' "$EOS/modules/services-systemd.conf"

          ! grep -Eq 'packagechooser|netinstall|eos_pacman|pacstrap|eos_script' "$EOS/settings_online.conf"
          ! grep -Eq 'packagechooser|netinstall|eos_pacman|pacstrap|eos_script' "$EOS/settings_offline.conf"
          grep -Fq 'action.id === "com.github.calamares.calamares"' build/airootfs/etc/polkit-1/rules.d/49-forja-calamares.rules
          echo "OK: patcher aplicado e fluxos online Arch/offline separados e verificados"
