name: Validate Forja OS independent XFCE profile

on:
  push:
    branches:
      - forja-xfce-interface
      - feature/forja-xfce-store-integration
    paths:
      - 'build-cloud.sh'
      - 'build-manjaro.sh'
      - 'desktops/xfce/**'
      - 'forja-pamac-pacman/**'
      - '.github/workflows/validate-forja-xfce-manjaro.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forja-xfce-manjaro-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xfce-manjaro-preflight:
    name: Forja XFCE package/profile preflight (no ISO build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Forja OS source
        uses: actions/checkout@v4

      - name: Validate generator shell syntax
        run: |
          set -euo pipefail
          for script in build-cloud.sh build-manjaro.sh \
            desktops/xfce/apply-forja-layout.sh desktops/xfce/install-branding.sh \
            desktops/xfce/plymouth/forja-mkinitcpio.conf \
            forja-pamac-pacman/install.sh forja-pamac-pacman/build-pamac.sh forja-pamac-pacman/src/forja-pkexec-sudo; do
            bash -n "$script"
          done
          python3 -m py_compile forja-pamac-pacman/src/forja_store_core.py forja-pamac-pacman/src/forja-pacman-transaction forja-pamac-pacman/src/forja-update-indicator
          python3 -m unittest discover -s forja-pamac-pacman/tests -v

      - name: Install ShellCheck and Docker
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 desktops/xfce/apply-forja-layout.sh desktops/xfce/install-branding.sh
          shellcheck -S warning -e SC1091 forja-pamac-pacman/install.sh forja-pamac-pacman/build-pamac.sh forja-pamac-pacman/src/forja-pkexec-sudo
          docker --version
          docker info

      - name: Pull Manjaro build environment
        run: docker pull manjarolinux/base:latest

      - name: Execute Forja XFCE generator preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/forja-manjaro-xfce-preflight"
          docker run --rm \
            --privileged \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/forja-ci:ro" \
            -v "$RUNNER_TEMP/forja-manjaro-xfce-preflight:/tmp/forja-manjaro" \
            -e FORJA_DISTRIBUTION=manjaro \
            -e FORJA_DESKTOP=xfce \
            -e FORJA_KERNEL=lts \
            -e FORJA_PREFLIGHT_ONLY=1 \
            -e FORJA_OUTPUT=/tmp/forja-output \
            manjarolinux/base:latest \
            bash -lc 'bash /forja-ci/build-cloud.sh'

      - name: Confirm ISO build was not started
        if: always()
        run: |
          echo "Este workflow valida pacotes e o perfil XFCE próprio da Forja OS."
          echo "FORJA_PREFLIGHT_ONLY=1 impede a chamada ao buildiso."
          echo "Nenhuma ISO é criada ou publicada por este workflow."
