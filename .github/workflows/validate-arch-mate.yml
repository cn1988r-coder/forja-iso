name: Validar VENOM OS Arch MATE

# Esta workflow compila somente o componente GTK4 e executa verificações estáticas.
# Não executa mkarchiso e não gera mídia.
on:
  workflow_dispatch:
  push:
    branches:
      - optimize/venom-iso-size
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'build/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/PROJECT-CONTINUITY.md'
      - '.github/workflows/build-arch-iso.yml'
      - '.github/workflows/validate-arch-mate.yml'

permissions:
  contents: read

concurrency:
  group: venom-static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Instalar ferramentas de validação
        run: |
          pacman -Syu --noconfirm
          pacman -Fy --noconfirm
          pacman -S --needed --noconfirm git gcc meson ninja pkgconf gtk4 json-glib glib2 ncurses shellcheck

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar TUI e executar testes do instalador
        run: |
          meson setup /tmp/venom-installer-build installer
          meson compile -C /tmp/venom-installer-build
          meson test -C /tmp/venom-installer-build --print-errorlogs

      - name: Validar perfil, painel, compilação GTK4 e testes
        run: |
          chmod +x scripts/*.sh
          scripts/validate-scope.sh

      - name: ShellCheck dos scripts ativos
        run: |
          shellcheck -S error \
            scripts/build-venom-iso.sh \
            scripts/validate-arch-profile.sh \
            scripts/validate-build.sh \
            scripts/validate-scope.sh \
            scripts/test-mate-panel.sh
