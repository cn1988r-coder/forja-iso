name: Validate VENOM Arch MATE profile

on:
  workflow_dispatch:
  push:
    branches:
      - optimize/venom-iso-size
    paths:
      - 'build/**'
      - 'installer/**'
      - 'scripts/validate-arch-profile.sh'
      - '.github/workflows/validate-arch-mate.yml'

permissions:
  contents: read

concurrency:
  group: venom-static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install static validation tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git archiso python python-yaml shellcheck

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate profile and official package availability
        run: |
          chmod +x scripts/validate-arch-profile.sh
          bash scripts/validate-arch-profile.sh

      - name: Check shell syntax
        run: |
          bash -n scripts/build-venom-iso.sh
          bash -n scripts/validate-arch-profile.sh
          shellcheck -S error scripts/build-venom-iso.sh scripts/validate-arch-profile.sh
