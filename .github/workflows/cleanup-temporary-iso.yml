name: Clean temporary FORJA OS ISO releases
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary ISO releases older than 24 hours
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mapfile -t expired < <(
            gh release list --limit 100 --json tagName,createdAt --jq '
              .[]
              | select(.tagName | startswith("forja-xfce-temp-"))
              | select((now - (.createdAt | fromdateiso8601)) >= 86400)
              | .tagName
            '
          )
          for tag in "${expired[@]}"; do
            echo "Removing expired temporary ISO release: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
          echo "Expired temporary releases removed: ${#expired[@]}"
