panels=panel1

[panel1]
plugins=fancymenu,taskbar,statusnotifier,tray,volume,networkmonitor,worldclock,showdesktop
position=Bottom
alignment=Left
size=40
length=100
desktop=0
opacity=100
background-color=#101216
font-color=#e8edf5
hidable=false
animation-duration=0

[fancymenu]
type=fancymenu
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[taskbar]
type=taskbar
alignment=Left
buttonWidth=180
closeOnMiddleClick=true
groupingEnabled=true

[statusnotifier]
type=statusnotifier
alignment=Right

[tray]
type=tray
alignment=Right

[volume]
type=volume
device=0
alignment=Right

[networkmonitor]
type=networkmonitor
alignment=Right

[worldclock]
type=worldclock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
