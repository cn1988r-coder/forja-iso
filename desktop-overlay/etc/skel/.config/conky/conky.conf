    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'DCE8F2',
    draw_borders = true,
    draw_graph_borders = true,
    double_buffer = true,
    own_window = true,
    own_window_type = 'desktop',
