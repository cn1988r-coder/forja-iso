# Adiciona o Plymouth depois do hook de dispositivos, preservando os hooks
# definidos pela base Manjaro. Não substitui a configuração original.
_forja_hooks=()
_forja_plymouth_added=0
for _forja_hook in "${HOOKS[@]}"; do
  _forja_hooks+=("$_forja_hook")
  if [[ "$_forja_hook" == "udev" && "$_forja_plymouth_added" -eq 0 ]]; then
    _forja_hooks+=("plymouth")
    _forja_plymouth_added=1
  fi
done
if [[ "$_forja_plymouth_added" -eq 0 ]]; then
  for _forja_hook in "${HOOKS[@]}"; do
    if [[ "$_forja_hook" == "systemd" ]]; then
      _forja_hooks+=("plymouth")
      _forja_plymouth_added=1
      break
    fi
  done
fi
if [[ "$_forja_plymouth_added" -eq 1 ]]; then
  HOOKS=("${_forja_hooks[@]}")
fi
unset _forja_hooks _forja_hook _forja_plymouth_added
