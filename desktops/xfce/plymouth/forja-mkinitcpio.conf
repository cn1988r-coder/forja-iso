# Insere Plymouth imediatamente após o hook de dispositivos do mkinitcpio.
# Funciona tanto com a sequência tradicional (udev) quanto com systemd.
_forja_hooks=()
_forja_plymouth_added=0
for _forja_hook in "${HOOKS[@]}"; do
  # Evita duplicar Plymouth caso o perfil-base já o tenha incluído.
  [[ "$_forja_hook" == "plymouth" ]] && continue
  _forja_hooks+=("$_forja_hook")
  if [[ "$_forja_plymouth_added" -eq 0 && ( "$_forja_hook" == "udev" || "$_forja_hook" == "systemd" ) ]]; then
    _forja_hooks+=("plymouth")
    _forja_plymouth_added=1
  fi
done
if [[ "$_forja_plymouth_added" -eq 0 ]]; then
  echo "Forja OS: não foi encontrado hook udev/systemd; Plymouth não pode ser inserido com segurança." >&2
  return 1
fi
HOOKS=("${_forja_hooks[@]}")
unset _forja_hooks _forja_hook _forja_plymouth_added
