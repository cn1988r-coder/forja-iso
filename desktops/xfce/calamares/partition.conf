---
# Forja OS XFCE: instalação em Btrfs, sem seletor de outros sistemas de arquivos.
efi:
  mountPoint: "/efi"
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: "EFI"

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]
initialPartitioningChoice: none
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true

partitionLayout:
  - name: "forja"
    filesystem: "unknown"
    mountPoint: "/"
    size: 100%
