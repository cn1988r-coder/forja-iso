---
# Layout Btrfs da Forja XFCE. O Snapper cria /.snapshots como subvolume
# dedicado dentro da raiz @; /home fica separado e não entra nos snapshots root.
setSELinux: false

btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/log
    subvolume: /@log

mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1, noatime ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
