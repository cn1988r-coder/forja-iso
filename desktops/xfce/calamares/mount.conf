---
# Compressão transparente para Btrfs, sem opções agressivas de descarte.
mountOptions:
  - filesystem: default
    options: [ defaults ]
  - filesystem: efi
    options: [ defaults, umask=0077 ]
  - filesystem: btrfs
    options: [ defaults, compress=zstd:1 ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
