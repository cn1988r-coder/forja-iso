# Forja OS XFCE live profile settings. No Manjaro-specific services.
displaymanager="lightdm"
autologin="true"
custom_boot_args=(quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false)
enable_systemd=('NetworkManager' 'bluetooth')
enable_systemd_live=('NetworkManager' 'bluetooth')
