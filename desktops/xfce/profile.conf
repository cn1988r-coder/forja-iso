# Perfil próprio da Forja OS: base técnica Manjaro, sessão XFCE configurada pela Forja.
displaymanager="lightdm"
autologin="true"
# Parâmetros da sessão Live: mantém o boot silencioso e solicita o splash Plymouth.
custom_boot_args=(quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0 systemd.show_status=false rd.systemd.show_status=false)
nonfree_mhwd="false"
enable_systemd=('NetworkManager' 'bluetooth')
enable_systemd_live=('NetworkManager' 'bluetooth' 'manjaro-live' 'mhwd-live' 'pacman-init' 'mirrors-live')
