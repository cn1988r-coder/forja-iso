#
# VENOM OS: configuração de pacotes baseada exclusivamente nos repositórios oficiais Arch.
#
[options]
Architecture = auto
Color
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# Local AUR packages bundled with the VENOM live ISO.
[venom-aur]
Server = file:///usr/share/venom/aur-repo
