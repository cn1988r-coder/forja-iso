#
# VENOM OS: pacotes oficiais Arch e repositório AUR local temporário para Pamac.
#
[options]
Architecture = auto
Color
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

# Temporary build-time repository populated from the Arch AUR PKGBUILDs.
[venom-aur]
SigLevel = Optional
Server = file:///tmp/venom-aur-repo
