insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod all_video
insmod serial
serial --unit=0 --speed=115200
terminal_input --append serial console
terminal_output --append serial console
set timeout=10
set default=0

menuentry "VENOM OS Live (%ARCH%, UEFI)" --class gnu-linux --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Desligar" { halt }
menuentry "Reiniciar" { reboot }
