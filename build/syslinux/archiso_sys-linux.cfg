LABEL venom
TEXT HELP
Iniciar a VENOM OS Live baseada no Arch Linux oficial.
ENDTEXT
MENU LABEL VENOM OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL venom-lts
TEXT HELP
Iniciar a VENOM OS Live com kernel LTS (reserva).
ENDTEXT
MENU LABEL VENOM OS Kernel LTS (%ARCH%, BIOS) [RESERVA]
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
