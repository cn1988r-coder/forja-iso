---
modules-search: [ local ]
instances:
  - id: venominstall
    module: venominstall
  - id: venom-btrfs
    module: venom-btrfs
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - fstab
      - venominstall
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - services-systemd
      - initcpiocfg
      - bootloader
      - grubcfg
      - venom-btrfs
  - show:
      - finished
branding: venom
prompt-install: false
dont-chroot: false
