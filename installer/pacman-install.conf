# Configuração temporária do pacman usada somente pelo pacstrap da VENOM OS.
# O repositório AUR local existe na mídia live e não é gravado no sistema instalado.
[options]
Architecture = auto
Color
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[venom-aur]
SigLevel = Optional
Server = file:///usr/share/venom/aur-repo
