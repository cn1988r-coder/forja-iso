---
units:
  - name: "NetworkManager.service"
    action: "enable"
    mandatory: true
  - name: "bluetooth.service"
    action: "enable"
    mandatory: false
  - name: "cronie.service"
    action: "enable"
    mandatory: false
  - name: "lightdm.service"
    action: "enable"
    mandatory: true
  - name: "graphical.target"
    action: "set-default"
    mandatory: true
  - name: "pacman-init.service"
    action: "mask"
    mandatory: false
