---
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: bluetooth
    action: enable
    mandatory: false
  - name: cronie
    action: enable
    mandatory: false
  - name: lightdm
    action: enable
    mandatory: true
  - name: graphical.target
    action: set-default
    mandatory: true
  - name: pacman-init
    action: mask
    mandatory: false
