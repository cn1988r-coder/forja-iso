# VENOM OS XFCE 1.0
# Based on the Manjaro Calamares module sequence.
---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksopenswaphookcfg
      - luksbootkeyfile
      - plymouthcfg
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - mhwdcfg
      - networkcfg
      - hwclock
      - services-systemd
      - grubcfg
      - bootloader
      - postcfg
      - umount
  - show:
      - finished

branding: venom
prompt-install: false
dont-chroot: false
