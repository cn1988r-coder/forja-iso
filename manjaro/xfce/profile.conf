##########################################
# Manjaro XFCE desktop profile
# XFCE is layered on the unchanged Manjaro base.
##########################################

multilib="false"
displaymanager="lightdm"
extra="false"
efi_boot_loader="grub"

# Use the official Manjaro Calamares hardware-detection integration.
mhwd_used="true"

# Network, Bluetooth and first-boot Papirus Blue setup.
enable_systemd=('NetworkManager' 'bluetooth' 'venom-papirus-blue')
