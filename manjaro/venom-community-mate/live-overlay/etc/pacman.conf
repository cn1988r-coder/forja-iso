[options]
Architecture = auto
ParallelDownloads = 10
Color
ILoveCandy
VerbosePkgLists
SigLevel = Required DatabaseNever
LocalFileSigLevel = Optional

[venom-community]
SigLevel = PackageRequired
Server = https://repo.biglinux.com.br/update-stable/$arch

[core]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist

[extra]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist

[multilib]
SigLevel = PackageRequired
Include = /etc/pacman.d/mirrorlist
