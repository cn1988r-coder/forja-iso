############################################
#### VENOM OS Community MATE ISO profile ####
############################################

multilib="true"
displaymanager="lightdm"
efi_boot_loader="grub"
login_shell="/bin/bash"
label="VENOM_OS_COMMUNITY_MATE"

hostname="venom"
username="venom"
password="venom"
addgroups="lp,network,power,wheel,users,storage,input,audio"

enable_systemd=('systemd-timesyncd' 'bluetooth' 'cronie' 'NetworkManager' 'lightdm' 'venom-dconf-update')
disable_systemd=('pacman-init')
disable_systemd_live=('mirrors-live' 'pacman-init')
