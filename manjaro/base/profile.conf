##########################################
# Minimal Manjaro base profile
# No graphical desktop or desktop identity.
##########################################

# No display manager or desktop session.
displaymanager="none"

# Minimal package selection.
extra="false"

# Use GRUB for UEFI boot.
efi_boot_loader="grub"

# Enable only essential system services.
enable_systemd=('NetworkManager')

# No graphical session, live-session branding or desktop autologin.
