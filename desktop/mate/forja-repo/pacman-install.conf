# Shares the installed package database but exposes only the Forja repository.
# Arch repositories are intentionally absent to keep this update channel independent.
[options]
Architecture = auto
Color
ParallelDownloads = 5
SigLevel = Required DatabaseRequired
LocalFileSigLevel = Optional
DBPath = /var/lib/pacman/
CacheDir = /var/cache/pacman/pkg/

[forja]
SigLevel = Required DatabaseRequired
Server = https://cn1988r-coder.github.io/forja-updates/$arch
